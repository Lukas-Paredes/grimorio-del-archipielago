<!-- Preferencias ANTES del primer frame: pausa de movimiento (grimorio:motion /
     reduced-motion) y velo de bruma si venimos de otra página del camino.
     Idéntico en todas las páginas del sistema nuevo. -->
<script>
(function () {
  try {
    var m = localStorage.getItem("grimorio:motion");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (m === "off" || (m === null && reduce)) {
      document.documentElement.classList.add("motion-off");
    }
    if (sessionStorage.getItem("grimorio:bruma") === "1") {
      document.documentElement.classList.add("bruma-in");
    }
  } catch (e) {}
})();
</script>

<!-- Imágenes de ESTA criatura. Las url() de variables CSS las resuelve el
     navegador relativo a ficha.css (assets/css/), por eso van con "../img/...".
     El <img> del hero, en cambio, es relativo a la página: "assets/img/...". -->
<style>
  body {
    --img-fondo: none;                                  /* sin imagen de mar; solo penumbra */
    --img-descenso: none;                               /* sin naufragio; degradado abisal neutro */
    --img-cierre: none;                                 /* sin lecho marino; degradado abisal neutro */
  }
</style>

<!-- Config de la página. GENERADA por herramientas/generar_fichas.py desde
     El_Grimorio_Datos_Estructurados.txt (raw VERBATIM) + contenido/prosa/<id>.txt.
     No editar a mano: regenerar. ficha.js la lee (window.FICHA). -->
<script>
  window.FICHA = {
    raw: `@ENTIDAD
ID:: brujo-chilote
NOMBRE:: El Brujo chilote
ALIAS:: El Brujo de Chiloé
SECCION:: 09-recta-provincia
CATEGORIA:: brujo-humano
REINO:: lugar
ORIGEN:: mestizo
ALCANCE:: chilota
CONDICION:: ambiguo
JERARQUIA:: Miembro de la cofradía de la Recta Provincia
GANCHO:: No es un monstruo: es una persona, un vecino, un viejo de la isla a quien uno saluda en el muelle. Esa es su parte más temible.
RESUMEN:: Persona con poderes mágicos, miembro de una organización secreta, que puede sanar o matar. Fusión de la machi y el calcu mapuche con la bruja europea.
DESCRIPCION:: El brujo chilote es una persona con poderes mágicos que pertenece a una organización secreta. Puede sanar o matar, según le paguen y le plazca; se le teme y respeta por igual. No es un invento puro ni indígena ni europeo: nace de la fusión de personas que sabían de medicina natural y hierbas, de figuras mapuche (la machi sanadora y el calcu hechicero), y de las creencias europeas sobre brujas (pacto con el Diablo, vuelo nocturno, aquelarre). De esa mezcla, en el aislamiento de las islas y con aporte de esclavos africanos, nació el brujo chilote.
VARIANTE:: El Código de Moral | Según algunas fuentes, al brujo se le hacía jurar un "Código de Moral" que le prohibía la violación de mujeres y el hurto.
RELACIONES:: machi; calcu; recta-provincia; iniciacion; macun; poderes-del-brujo
FUENTE:: Cavada (1914)
FUENTE:: Cárdenas, Chiloé: manual del pensamiento mágico (1985)
ENLACE:: https://es.wikipedia.org/wiki/Brujos_de_Chilo%C3%A9
@FIN`,
    prosa: {
      "descripcion": [
        "El Brujo chilote no es un monstruo: es una persona —un vecino, un viejo de la isla, alguien que uno saluda en el muelle. Esa es, justamente, su parte más temible. Tiene poderes mágicos y pertenece a una organización secreta. Puede sanar o puede matar, según le paguen y según le plazca. Se le teme y se le respeta por igual.",
        "Los brujos de Chiloé no son un invento puro ni indígena ni europeo: son una mezcla. Su raíz está, por un lado, en personas reales que sabían de medicina natural, de hierbas, de curar; y por otro, en figuras de la tradición mapuche —la machi (sanadora) y sobre todo el calcu (el hechicero que hace daño). A eso se sumaron, con la conquista, las creencias europeas sobre las brujas: el pacto con el Diablo, el vuelo nocturno, el aquelarre. De esa fusión, en el aislamiento de las islas, nació el brujo chilote tal como se le teme hoy."
      ]
    },
    cierre: "No es un monstruo: es una persona.",
    galeria: [],
    publicadas: ["caleuche", "pincoya", "trauco", "invunche", "cueva-quicavi", "recta-provincia", "brujo-chilote", "macun", "challanco", "voladora", "juicio-1880", "camahueto"]
  };
</script>
