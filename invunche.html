<!-- Preferencias ANTES del primer frame: pausa de movimiento (grimorio:motion /
     reduced-motion) y velo de bruma si venimos de otra página del camino.
     Idéntico en todas las páginas del sistema nuevo. -->
<script>
(function () {
  try {
    var m = localStorage.getItem("grimorio:motion");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (m === "off" || (m === null && reduce)) {
      document.documentElement.classList.add("motion-off");
    }
    if (sessionStorage.getItem("grimorio:bruma") === "1") {
      document.documentElement.classList.add("bruma-in");
    }
  } catch (e) {}
})();
</script>

<!-- Imágenes de ESTA criatura. Las url() de variables CSS las resuelve el
     navegador relativo a ficha.css (assets/css/), por eso van con "../img/...".
     El <img> del hero, en cambio, es relativo a la página: "assets/img/...". -->

    --img-fondo: none;                                  /* sin imagen de mar; solo penumbra */

</style>

<!-- Config de la página. GENERADA por herramientas/generar_fichas.py desde
     El_Grimorio_Datos_Estructurados.txt (raw VERBATIM) + contenido/prosa/<id>.txt.
     No editar a mano: regenerar. ficha.js la lee (window.FICHA). -->
<script>
  window.FICHA = {
    raw: `@ENTIDAD
ID:: invunche
NOMBRE:: El Invunche
ALIAS:: Imbunche; Ivunche; el Machucho de la cueva
SECCION:: 09-recta-provincia
CATEGORIA:: guardian
REINO:: lugar
ORIGEN:: mestizo
ALCANCE:: chilota
CONDICION:: malefico
JERARQUIA:: Guardián de la cueva de los brujos
ADVERTENCIA:: El relato de su creación es de los más oscuros de Chiloé. Se conserva sin suavizar, como testimonio.
GANCHO:: En la boca de la cueva de los brujos hay algo que vigila. Fue un niño, una vez. Ya no.
RESUMEN:: Ser deforme creado por los brujos a partir de un niño, que guarda la entrada de la Cueva de Quicaví. No puede hablar y se mueve torcido.
DESCRIPCION:: Criatura monstruosa y deforme que guarda la entrada de las cuevas de los brujos y les sirve de consejero (responde sí o no con la cabeza). No nace: es hecho. Los brujos roban un niño primogénito menor de nueve días, le "raspan" el bautismo, le quiebran y tuercen la pierna derecha hasta ponérsela sobre la espalda, le tuercen el pie y a veces la cabeza hacia atrás. Lo dejan desnudo, cubierto de pelos, hinchado por las palizas. Usa un báculo retorcido como el Trauco.
VARIANTE:: El origen del niño (discrepancia) | Unos dicen que es un niño robado (Cavada, Quintana); otros, que es el hijo de un brujo entregado a la cofradía (Molina 1950); una tercera versión lo dice "producto de la unión de un calcu con una bruja". No hay acuerdo.
VARIANTE:: Arma de venganza | Para causar daño, los brujos lo sacan de la cueva azotándolo hasta el lugar del maleficio; emite chivateos que anuncian su paso.
INTERPRETACION:: Comparado con el macho cabrío europeo (el diablo) y los "blemias" medievales. Es la criatura chilota que más toca el horror puro.
RELACIONES:: cueva-quicavi; calcu; recta-provincia; trauco
FUENTE:: Cavada (1914)
FUENTE:: Molina (1950); Cárdenas (1998)
ENLACE:: https://es.wikipedia.org/wiki/Imbunche
@FIN`,
    prosa: {
      "descripcion": [
        "El Invunche es una criatura monstruosa y deforme que guarda la entrada de las cuevas de los brujos —y es, a la vez, su consejero. No puede hablar: a lo más, responde con movimientos de cabeza, sí o no, cuando los brujos le consultan. Se mueve con torpeza torcida, casi en tres patas. No nace: es hecho. Son los brujos quienes lo crean, a partir de un niño.",
        "Los brujos roban un niño primogénito, menor de nueve días. Lo llevan a la Cueva. Si está bautizado, le «raspan» el bautismo. Le quiebran y le tuercen la pierna derecha hasta ponérsela sobre la espalda —de modo que parezca brotarle de la nuca. Le tuercen el pie en dirección contraria a la marcha. Y —agregan algunos— le tuercen también la cabeza hacia atrás, para despistar a quien ose entrar. Lo dejan desnudo, el cuerpo cubierto de largos pelos, e hinchado por las palizas que recibe. Para desplazarse usa un báculo retorcido, como el Trauco."
      ],
      "interpretacion": "Se le ha comparado con el macho cabrío del imaginario europeo —el diablo— y con los antiguos «blemias», seres de horribles malformaciones de la tradición medieval. Es, entre todas las criaturas de Chiloé, la que más de cerca toca el horror puro."
    },
    cierre: "Y en lo hondo de la cueva, la guardia no termina.",
    galeria: [],
    publicadas: ["caleuche", "pincoya", "trauco", "invunche", "cueva-quicavi", "recta-provincia", "brujo-chilote", "macun", "challanco", "voladora", "juicio-1880", "camahueto"]
  };
</script>
