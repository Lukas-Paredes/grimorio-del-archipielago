  <script>
  'use strict';
  const CONTENT_VERSION=7;
  const MUSEUM_CONFIG=Object.freeze({
    storageKey:'grimorio.archipielago.v7.museum',v6StorageKey:'grimorio.archipielago.v6.museum',
    migrationBackupKey:'grimorio.archipielago.v7.v6-backup',saveDelay:220,requiredFragments:3,
    updatedAt:'23 de junio de 2026',territory:'Archipiélago de Chiloé'
  });
  const SEALS=Object.freeze({
    history:'Documento histórico',tradition:'Tradición documentada',variant:'Variante territorial',
    interpretation:'Interpretación curatorial',art:'Recreación artística',fiction:'Recreación narrativa',
    pending:'Pendiente de validación'
  });
  const SOURCES=Object.freeze([
    {id:'memoria-chilena',title:'Memoria Chilena',type:'Portal patrimonial general',url:'https://www.memoriachilena.gob.cl/',status:'general',note:'La V6 sólo aportó este portal general. Faltan entrada, edición y página para sostener afirmaciones específicas.'},
    {id:'patrimonio-cultural',title:'Servicio Nacional del Patrimonio Cultural',type:'Portal institucional general',url:'https://www.patrimoniocultural.gob.cl/',status:'general',note:'Referencia institucional general disponible en V6; falta vinculación documental específica.'},
    {id:'pending-bibliography',title:'Bibliografía y revisión territorial específica',type:'Pendiente de investigación',url:'',status:'pending',note:'No incorporada en los archivos recibidos. Las afirmaciones dependientes de ella permanecen provisionales o pendientes.'}
  ]);
  const ILLUSTRATIONS=Object.freeze([
    {id:'cover',src:'assets/illustrations/01_portada_grimorio.webp',title:'Portada del Grimorio',alt:'Cubierta antigua del Grimorio entre niebla y agua.',credit:'',license:'',status:'pending',position:'50% 50%'},
    {id:'origin',src:'assets/illustrations/02_tenten_caicai.webp',title:'Tentén y Caicai',alt:'Interpretación artística de dos serpientes y un paisaje insular transformado.',credit:'',license:'',status:'pending',position:'50% 48%'},
    {id:'sea-court',src:'assets/illustrations/03_corte_del_mar.webp',title:'Corte del Mar',alt:'Interpretación artística de la corte submarina y sus relaciones.',credit:'',license:'',status:'pending',position:'52% 45%'},
    {id:'caleuche',src:'assets/illustrations/04_caleuche.webp',title:'Caleuche',alt:'Barco de luces entre niebla sobre un canal nocturno.',credit:'',license:'',status:'pending',position:'55% 45%'},
    {id:'trauco',src:'assets/illustrations/05_trauco.webp',title:'Trauco',alt:'Figura interpretativa del Trauco entre árboles y senderos.',credit:'',license:'',status:'pending',position:'50% 40%'},
    {id:'fiura',src:'assets/illustrations/06_fiura.webp',title:'Fiura',alt:'Interpretación artística de la Fiura en el monte.',credit:'',license:'',status:'pending',position:'50% 40%'},
    {id:'recta',src:'assets/illustrations/07_recta_provincia.webp',title:'Recta Provincia y Quicaví',alt:'Expediente visual interpretativo sobre la Recta Provincia.',credit:'',license:'',status:'pending',position:'50% 45%'},
    {id:'invunche-voladora',src:'assets/illustrations/08_invunche_voladora.webp',title:'Invunche y Voladora',alt:'Interpretación artística del Invunche y la Voladora.',credit:'',license:'',status:'pending',position:'50% 42%'},
    {id:'waters',src:'assets/illustrations/09_aguas_interiores.webp',title:'Camahueto y Cuchivilu',alt:'Paisaje de aguas interiores, barro y rastros de criaturas.',credit:'',license:'',status:'pending',position:'48% 50%'},
    {id:'dead-roads',src:'assets/illustrations/10_animas_cucao.webp',title:'Ánimas de Cucao',alt:'Costa occidental y camino nocturno con luces de memoria.',credit:'',license:'',status:'pending',position:'50% 45%'}
  ]);
  const CHAPTERS=Object.freeze([
    {id:'origin',index:1,world:'Mundo I',title:'El origen y la transformación del territorio',short:'Origen',accent:'#a7c6a0',illustrationId:'origin',guardianId:'guardian-origin',folioId:'folio-origin',next:'sea-court',cta:'Descender hacia el mar recién formado',
      opening:`La primera página no comienza con una isla inmóvil. Comienza con dos fuerzas que disputan el paisaje. El agua asciende; la tierra responde elevándose. En las versiones difundidas del relato de Tentén Vilu y Caicai Vilu, el territorio no funciona como fondo: actúa, protege, amenaza y transforma. El Grimorio abre esta historia como una cosmogonía, una manera mítica de pensar el carácter insular y la relación entre alturas, mar y supervivencia. No existe aquí una reconstrucción única. Cambian los nombres, los énfasis y el destino de personas y animales según la versión. La escena propone observar antes de decidir: ¿qué permanece visible cuando sube la marea?, ¿qué se transforma cuando la tierra emerge? La ilustración es una recreación del proyecto; las ideas educativas provienen de los contenidos ya registrados en la V6 y permanecen abiertas a bibliografía específica.`,
      explanation:`Tentén y Caicai forman una oposición complementaria: tierra y agua, elevación e inundación, refugio y fuerza transformadora. La tradición divulgada reúne estos elementos para explicar míticamente un paisaje de islas, canales y alturas. El valor educativo del relato no depende de tomarlo como descripción geológica ni de fijar una versión definitiva. Permite comprender que, dentro del imaginario, el territorio tiene voluntad narrativa. Personas y animales pueden salvarse, cambiar o quedar ligados a nuevas formas del paisaje según el relato consultado. La V7 separa tres niveles: la recreación visual que permite experimentar la marea; la explicación de la tradición disponible en los archivos de base; y el archivo de variantes que aún necesita fuentes específicas. Esta distinción ayuda a leer el mito como una red de sentidos sin convertir una interpretación del museo en una voz tradicional.`,
      closure:`Al cerrar este mundo, tierra y mar dejan de parecer espacios pasivos. Son fuerzas que organizan lo que viene después. El Folio del Origen no afirma que exista una sola narración correcta: conserva el conflicto, las transformaciones y la necesidad de comparar versiones. Reconocer a Tentén implica recordar la elevación y el refugio; reconocer a Caicai implica recordar el ascenso del agua y su potencia transformadora. Entre ambos aparece el paisaje insular que sostendrá los demás relatos.`,
      transition:`El territorio ha emergido, pero queda rodeado por un mar que no está vacío. Bajo su superficie se organizan parentescos, jerarquías y figuras asociadas a la abundancia. Para comprender las luces de la noche, primero hay que descender a la corte que imagina el océano como una sociedad.`},
    {id:'sea-court',index:2,world:'Mundo II',title:'La corte y los habitantes del mar',short:'Corte del Mar',accent:'#75b7b4',illustrationId:'sea-court',guardianId:'guardian-court',folioId:'folio-tide',next:'caleuche',cta:'Seguir la corriente fuera de la corte',
      opening:`Bajo la superficie, el mar del Grimorio no se presenta como una colección de criaturas aisladas. Se organiza como una corte. Millalobo ocupa el centro de relaciones que incluyen a Huenchula, Pincoya, Pincoy y otras presencias marinas. La escena desciende por capas: primero la luz de la superficie, luego las corrientes que conectan figuras y finalmente la profundidad donde aparece el soberano. Esta organización es una lectura curatorial construida a partir de las relaciones ya declaradas en V6. Las genealogías cambian entre compilaciones y todavía requieren documentación específica. Por eso el visitante no completa un árbol familiar rígido: reconstruye una red marcada como variable. La pregunta del capítulo no es sólo quién vive bajo el agua, sino qué ideas humanas se proyectan sobre el mar cuando se lo imagina con parentescos, autoridad, tránsito y abundancia.`,
      explanation:`Millalobo articula el imaginario submarino; Huenchula permite pensar el tránsito entre mundo humano y marino; Pincoya concentra relatos sobre abundancia y la dirección de su danza; Pincoy aparece relacionado con ella en repertorios cuya función exacta debe compararse; la Sirena Chilota y el Caballo Marino amplían el campo del canto, el viaje y la advertencia. El paisaje costero importa porque estas figuras se relacionan con orillas, mareas, pesca y movimiento entre islas. La V7 no convierte esas asociaciones en recomendaciones ni las presenta como una doctrina homogénea. Enseña a reconocer funciones recurrentes y, al mismo tiempo, muestra dónde las genealogías y atributos permanecen pendientes. Las corrientes visuales funcionan como metáfora: una relación puede ser de parentesco en una versión, de asociación temática en otra o simplemente una comparación curatorial.`,
      closure:`El Folio de la Marea reúne una idea central: el mar chilote imaginado posee orden, relaciones y transformaciones. Millalobo importa menos como figura solitaria que como centro de una red. Pincoya y Pincoy no son nombres intercambiables; Huenchula introduce una historia de tránsito; canto, abundancia y viaje amplían las maneras de leer el borde. Comprender la corte prepara al visitante para reconocer lo excepcional: aquello que navega fuera de una jerarquía visible y sólo se anuncia mediante señales.`,
      transition:`Fuera de la corte, tres luces avanzan detrás de la niebla. No responden a un árbol de parentescos y no permiten ver de inmediato a quienes viajan a bordo. La marea conduce ahora hacia el mar nocturno, donde escuchar puede ser tan importante como mirar.`},
    {id:'caleuche',index:3,world:'Mundo III',title:'La bruma y el mar nocturno',short:'Caleuche',accent:'#90c7cf',illustrationId:'caleuche',guardianId:'guardian-caleuche',folioId:'folio-fog',next:'forest',cta:'Dejar el canal y entrar al monte',
      opening:`Primero se ven las luces. No avanzan como las de una casa ni tiemblan como las de una embarcación común. Permanecen suspendidas sobre el canal, tres puntos dorados detrás de la niebla. Después llega la música, demasiado lejana para reconocer sus instrumentos y demasiado cercana para ignorarla. Esta entrada es una recreación narrativa del Grimorio: no pretende ser una cita tradicional. Su función es enseñar cómo se reconoce una figura antes de verla completa. En los contenidos disponibles, el Caleuche se asocia a faroles, música, bruma y aparición nocturna. Lo que cambia es quiénes lo tripulan, qué ocurre con quienes navegan y cómo se relaciona con desaparecidos, transformaciones o saberes secretos. La escena invita a seguir señales y comparar versiones dentro del mismo paisaje, sin convertir al barco en adversario ni fijar una sola explicación.`,
      explanation:`El Caleuche es un barco encantado del imaginario chilote cuya fuerza narrativa reside en la incertidumbre. Sus señales recurrentes permiten reconocerlo aunque su tripulación y función varíen. Algunas versiones hablan de aparecidos; otras, de navegantes transformados o desaparecidos; ciertas compilaciones lo conectan con brujos y desplazamientos extraordinarios. La V7 conserva estas posibilidades como variantes provisionales porque los archivos recibidos no aportan ediciones ni páginas específicas. También distingue el relato tradicional de la literatura y la imagen contemporánea: la silueta del barco, sus tres luces y la niebla de esta interfaz son decisiones artísticas. El visitante aprende a no usar una representación visual como prueba documental. La música posee una transcripción conceptual para que la experiencia funcione sin sonido.`,
      closure:`El Folio de la Bruma conserva señales más que certezas: luces, música y niebla permiten reconocer al Caleuche, pero no resuelven quién navega ni por qué aparece. Esa inestabilidad es parte del aprendizaje. Comparar versiones evita convertir una figura cambiante en una ficha inmóvil. El barco conecta mar, ausencia, transformación y secreto; por eso su sombra puede conducir tanto a los desaparecidos como a los relatos de brujos.`,
      transition:`Las luces se apagan al aproximarse a la costa. Antes de abrir el expediente del secreto, el Grimorio obliga a aprender otra forma de orientación: los caminos del monte, los cantos de aves y los silbidos que pueden funcionar como advertencia.`},
    {id:'forest',index:4,world:'Mundo IV',title:'El monte, los senderos y los presagios',short:'Monte',accent:'#8eaf78',illustrationId:'trauco',guardianId:'guardian-forest',folioId:'folio-forest',next:'waters',cta:'Seguir las huellas hacia el agua interior',
      opening:`El monte no abre una sola ruta. Un sendero se bifurca, una rama cubre la vista y un canto obliga a decidir si continuar o regresar. En este mundo conviven figuras del bosque, aves reales leídas culturalmente como señales y relatos que han cumplido funciones sociales complejas. Trauco y Fiura aparecen como presencias del monte con descripciones variables. Chucao y Raiquén desplazan la atención hacia el paisaje sonoro; Piuchén queda en archivo abierto por su circulación más amplia y su documentación insuficiente. El capítulo trata con cautela los relatos vinculados a violencia o sexualidad. No reproduce explicaciones culpabilizadoras ni transforma atributos corporales en espectáculo. La interacción consiste en leer direcciones, distinguir presagio de criatura y reconocer que una señal puede depender del contexto y de quien cuenta.`,
      explanation:`El Trauco suele situarse en el monte y los senderos, asociado al encuentro, el peligro y explicaciones sociales que deben leerse críticamente. La Fiura funciona como contrapresencia femenina dentro de repertorios del bosque, con atributos físicos y familiares que cambian. El Chucao es un ave real; las interpretaciones de su canto y dirección pertenecen a prácticas y relatos culturales que no poseen una regla universal. El Raiquén y el Piuchén permanecen con estado curatorial pendiente. Esta diversidad permite enseñar una diferencia importante: no toda señal del monte toma la forma de un ser sobrenatural. Puede ser canto, huella, dirección, desorientación o advertencia. La V7 coloca la mediación crítica en un bloque secundario, pero no la oculta cuando el contenido puede reproducir violencia o estigma.`,
      closure:`El Folio del Monte no entrega una fórmula para interpretar el bosque. Enseña a preguntar qué tipo de presencia se está narrando: una figura, un ave, un presagio o una explicación social. Trauco y Fiura no son equivalentes; Chucao no deja de ser un ave real cuando su canto adquiere lectura cultural; las variantes requieren contexto. Saber orientarse aquí significa distinguir categorías antes de atribuirles una verdad única.`,
      transition:`Las huellas abandonan el suelo firme y se hunden en barro. El próximo mundo exige mirar los ambientes con precisión: estero, mallín, lago, corral y agua quieta no son el mismo escenario, y cada uno organiza criaturas diferentes.`},
    {id:'waters',index:5,world:'Mundo V',title:'Las aguas interiores y el barro',short:'Aguas interiores',accent:'#b2b47a',illustrationId:'waters',guardianId:'guardian-waters',folioId:'folio-inland',next:'recta',cta:'Seguir el surco hacia el expediente',
      opening:`El mar abierto queda atrás. La página se vuelve espesa: barro, vegetación, agua detenida y rastros que cruzan un mallín. Agrupar a Camahueto, Cuchivilu y Cuero del Agua sólo porque se relacionan con el agua impediría comprenderlos. Este capítulo separa ambientes y funciones narrativas. El Camahueto deja un surco y se asocia a fuerza y a un cuerno de poderes atribuidos según distintas versiones. El Cuchivilu aparece ligado a esteros, barro y alteración de corrales de pesca. El Cuero del Agua pertenece a un imaginario acuático más amplio y requiere delimitar qué variantes circulan específicamente en Chiloé. La escena funciona como mapa de hábitats: cada rastro abre una explicación y permite comparar cómo el ambiente define a la presencia.`,
      explanation:`El Camahueto se describe en la V6 como animal portentoso de un cuerno, relacionado con terreno húmedo, desplazamiento y poderes curativos o destructivos atribuidos. El Cuchivilu se sitúa en esteros y corrales de pesca; barro y agua alterada forman parte de su relato. El Cuero del Agua se presenta como superficie o piel que atrapa en aguas quietas, pero su circulación regional excede el territorio chilote y por eso se mantiene como variante provisional. La V7 evita convertir poderes atribuidos en consejos prácticos y no usa la palabra contaminación como hecho sin fuente específica. El aprendizaje consiste en emparejar figura, ambiente, señal y función: surco con mallín, barro con estero y superficie engañosa con agua quieta.`,
      closure:`El Folio de las Aguas Interiores conserva tres diferencias. Camahueto: fuerza, cuerno y surco. Cuchivilu: barro, estero y corral alterado. Cuero del Agua: superficie engañosa y circulación territorial todavía por delimitar. Reconocer el ambiente impide que la enciclopedia reduzca todas las criaturas acuáticas a una misma categoría.`,
      transition:`El surco atraviesa el paisaje y llega a una puerta cerrada. Algunas fuerzas se narran como habitantes del ambiente; otras aparecen ligadas a sistemas de secreto, mensajería, custodia y poder. Para entrar hay que abrir un expediente y distinguir sus registros.`},
    {id:'recta',index:6,world:'Mundo VI',title:'La Recta Provincia y el poder secreto',short:'Recta Provincia',accent:'#c69a6b',illustrationId:'recta',guardianId:'guardian-recta',folioId:'folio-secret',next:'dead-roads',cta:'Cerrar el expediente y encender el camino',
      opening:`La sexta página cambia de material. Ya no parece paisaje, sino expediente: hojas, sellos, cajones y una entrada oscura. La Recta Provincia exige mayor rigor porque reúne planos que suelen confundirse. Existe un campo histórico asociado a procesos y documentación; existe una organización legendaria con tribunales, jerarquías y mensajeros; existen figuras como Voladora e Invunche; y existe una cultura posterior que reinterpreta todo lo anterior. Los archivos recibidos no contienen expedientes, fechas ni citas concretas. Por eso la V7 no los inventa: muestra la arquitectura educativa de esos registros y coloca los detalles faltantes en la matriz curatorial. El Invunche guarda el umbral como figura legendaria de custodia. El encuentro mayor no es una recreación judicial presentada como historia, sino un Tribunal legendario que pregunta en qué columna debe leerse cada afirmación.`,
      explanation:`La presencia de documentación histórica sobre procesos no vuelve históricos todos los elementos de la tradición legendaria. Esa es la idea principal del capítulo. El “brujo” se presenta entre registros históricos, acusaciones, tradición y recreación posterior. La Voladora aparece como mensajera legendaria asociada a transformación y comunicación secreta. El Invunche se relaciona con cueva, custodia y secreto; su representación corporal pertenece al campo legendario y artístico. Chonchón o Tuetué y Basilisco funcionan como comparaciones cuya circulación y vínculo específico requieren investigación. La interfaz divide el contenido en cuatro cajones: Historia documentada, Organización legendaria, Figuras asociadas y Cultura posterior. Cada afirmación muestra su sello sin convertir la metodología en protagonista.`,
      closure:`El Folio del Secreto no entrega una lista de supuestos hechos. Entrega una herramienta de lectura: documento, tradición y recreación no son categorías intercambiables. La Recta Provincia puede estudiarse precisamente porque esos registros conviven y se transforman. Invunche y Voladora adquieren sentido dentro de la lógica legendaria de custodia y mensajería; el Tribunal funciona como síntesis educativa, no como reproducción de una institución histórica.`,
      transition:`Cuando el expediente se cierra, quedan nombres ausentes, caminos y memorias. El último mundo no busca resolver el secreto, sino comprender cómo los relatos conservan pérdida, advertencia, duelo y tránsito.`},
    {id:'dead-roads',index:7,world:'Mundo VII',title:'Los muertos, la costa y los caminos',short:'Muertos y caminos',accent:'#b8c2bd',illustrationId:'dead-roads',guardianId:'guardian-dead',folioId:'folio-roads',next:'epilogue',cta:'Reunir los siete Folios',
      opening:`La última página se abre hacia la costa occidental. El viento borra huellas, el temporal reduce la visibilidad y pequeñas luces aparecen sobre un camino. Las Ánimas de Cucao y La Condená permiten explorar diferencias entre aparición, presagio, memoria, duelo y relato moral. La V7 no convierte la muerte en espectáculo. Los relatos familiares y locales pueden variar, y los archivos recibidos no contienen testimonios autorizados que permitan fijarlos. Por eso la escena trabaja con categorías de lectura y una recreación respetuosa: cada farol abre una voz conceptual, no la voz atribuida a una persona real. El visitante debe reconocer cuándo una historia habla de un encuentro en el camino, cuándo funciona como advertencia y cuándo conserva la memoria de quienes murieron o desaparecieron.`,
      explanation:`Las Ánimas de Cucao se vinculan en V6 con costa occidental, viento, temporal y memoria de fallecidos. La Condená aparece como figura de pena y tránsito asociada a caminos nocturnos, con motivos y formas variables. El capítulo diferencia presencia sobrenatural, presagio y memoria: una aparición ocupa la escena del encuentro; un presagio anticipa o advierte; la memoria mantiene una ausencia dentro de la comunidad. Estos límites no siempre son rígidos, pero sirven para evitar que todas las historias de muertos se reduzcan a “fantasmas”. La dimensión territorial importa: costa abierta, temporal y camino modifican el modo en que una ausencia puede narrarse.`,
      closure:`El Folio de los Caminos reúne una enseñanza sobre cuidado. Las Ánimas no son piezas de colección; La Condená no posee una biografía única; las variaciones familiares requieren atribución y consentimiento antes de incorporarse como testimonio. Aparición, presagio y memoria pueden tocarse, pero nombrarlas por separado ayuda a leer qué función cumple cada relato.`,
      transition:`Los siete dominios ya no están separados. Origen, mar, bruma, monte, aguas interiores, secreto y caminos regresan a la cubierta. El Grimorio se abre ahora como enciclopedia: cada mundo puede estudiarse sin repetir el recorrido completo.`}
  ]);
  const CHAPTER_EXTENSIONS=Object.freeze([
    {chapterId:'origin',
      threshold:`La Voz del Grimorio propone mirar tres cosas al mismo tiempo: la altura que todavía sobresale, el agua que cambia la escala del mundo y las vidas que deben responder a esa transformación. El control de marea no “simula” una versión tradicional; permite observar la estructura del conflicto sin fingir un desenlace definitivo.`,
      tradition:`Leer este relato como cosmogonía significa atender a la pregunta que responde: cómo puede imaginarse el origen de un territorio compuesto por islas, canales y alturas. La respuesta mítica no reemplaza una explicación geológica; trabaja en otro registro. Vincula paisaje, peligro, protección y cambio. Tentén y Caicai permiten nombrar fuerzas opuestas sin aislarlas: la elevación sólo adquiere sentido frente a la inundación, y el agua sólo transforma porque encuentra tierra, personas y animales. En una enciclopedia responsable conviene separar el núcleo que se repite de los detalles que cambian. El núcleo disponible en V6 reúne serpientes, tierra elevada, agua ascendente y formación mítica del paisaje. Los detalles pendientes incluyen formas de los nombres, transformaciones específicas y alcance territorial de cada versión. La V7 no rellena esos vacíos con una narración propia. En su lugar, muestra cómo una variante modifica el énfasis: salvación, castigo, metamorfosis o explicación de la insularidad. También enseña que una ilustración puede combinar elementos para hacer visible una relación sin afirmar que esa composición haya sido transmitida exactamente así. Esta lectura prepara una habilidad que se repite en todo el museo: reconocer una estructura narrativa, distinguirla de sus variantes y preguntar qué fuente sostiene cada detalle. La comparación futura deberá registrar quién cuenta cada versión, en qué publicación aparece y qué elementos se añadieron después mediante literatura o divulgación.`,
      closure:`El visitante no necesita memorizar un orden único de acontecimientos para integrar el Folio. Debe poder explicar por qué Tentén y Caicai no son criaturas intercambiables, cómo la oposición entre tierra y agua transforma el paisaje y por qué los destinos de personas y animales permanecen abiertos a comparación. Esa comprensión convierte la primera página en fundamento de la Cosmología del Grimorio.`},
    {chapterId:'sea-court',
      threshold:`Descender no consiste en bajar una barra de profundidad. Cada selección cambia la red visible: una corriente enlaza soberanía, otra tránsito, otra danza y abundancia. El visitante puede abrir las figuras en cualquier orden y volver después a la genealogía para comprobar qué conexiones son provisionales.`,
      tradition:`La corte marina organiza un conjunto de figuras mediante categorías que ayudan a estudiar sus diferencias. Millalobo concentra soberanía y profundidad; Huenchula introduce tránsito entre dominios; Pincoya articula danza, abundancia y borde; Pincoy permanece relacionado, aunque su función exacta necesite documentación; Sirena Chilota aporta canto y advertencia; Caballo Marino, viaje extraordinario. Esta organización no afirma que todas las fuentes presenten una corte idéntica. Es una síntesis curatorial basada en los vínculos ya declarados por V6. La diferencia entre parentesco y asociación resulta decisiva. Un vínculo familiar necesita una versión o fuente que lo sostenga; una asociación temática puede reunir figuras porque comparten mar, canto o desplazamiento; una continuidad narrativa conecta capítulos para facilitar el aprendizaje. La V7 rotula esas relaciones y no dibuja todas las líneas iguales. También evita convertir la abundancia asociada a Pincoya en promesa o mecanismo. La danza se estudia como motivo narrativo con orientaciones y consecuencias variables. El borde costero aparece porque el mito dialoga con pesca, recolección y mareas, pero esas conexiones culturales necesitan investigación antes de presentarse como testimonio local. La corte enseña así una forma de lectura enciclopédica: cada figura posee identidad, relaciones y estado curatorial; ninguna existe sólo para completar la decoración de un soberano. En una revisión futura, cada línea de parentesco deberá citar su fuente y mostrar si otras compilaciones la contradicen, la omiten o la reorganizan.`,
      closure:`Para recibir el Folio, la persona debe poder describir la corte como una red y no como una familia fijada para siempre. Debe reconocer qué aporta Huenchula, por qué Pincoya no es Pincoy y dónde comienzan las preguntas abiertas. El mundo queda disponible para repaso con sus corrientes, fichas y relaciones diferenciadas.`},
    {chapterId:'caleuche',
      threshold:`La navegación horizontal se construye con tres umbrales sensoriales. Una luz permite observar; otra activa la transcripción de la música; la tercera abre el archivo de tripulaciones. La niebla no oculta contenido: cambia la forma en que ese contenido aparece y puede pausarse con las opciones de accesibilidad.`,
      tradition:`El Caleuche resulta especialmente adecuado para enseñar variantes porque conserva una identidad reconocible y, al mismo tiempo, relatos muy distintos. El barco puede anunciarse antes de ser visto: luces, música y niebla funcionan como señales dentro de la síntesis disponible. Sin embargo, una señal recurrente no garantiza que cada narración repita el mismo número, secuencia o significado. La decisión de mostrar tres luces pertenece al diseño solicitado para V7 y se rotula como recreación artística. La tripulación exige todavía más cuidado. Las categorías de aparecidos, navegantes transformados y desaparecidos se presentan como alternativas, no como una lista acumulativa. Una versión puede concentrarse en una de ellas sin incluir las demás. La relación con brujos y saberes secretos también se mantiene como asociación legendaria provisional. La V7 no inventa rutas, puertos, instrumentos musicales ni testimonios de avistamiento. En la capa de cultura posterior se reconoce que literatura, ilustración y divulgación han modelado la imagen contemporánea del barco, pero ese estudio queda pendiente de fuentes. El objetivo educativo es que el visitante distinga repetición y variación: reconocer el Caleuche por un conjunto de motivos no obliga a clausurar quién viaja, qué busca o cómo desaparece. La bruma se convierte así en una metáfora de información incompleta, no en excusa para afirmar cualquier cosa. La ficha separa además señal, conducta atribuida y representación: ver luces no equivale a documentar una aparición, y dibujar una nave no fija su forma tradicional.`,
      closure:`Integrar el Folio significa poder nombrar las señales recurrentes y explicar por qué la tripulación continúa abierta. También implica reconocer que el barco completo que aparece en pantalla es una composición artística. Con esas tres distinciones, el misterio permanece vivo sin ocupar el lugar de la documentación. El visitante puede regresar luego a cada variante sin repetir la navegación completa.`},
    {chapterId:'forest',
      threshold:`El bosque ofrece tres modos de exploración: seguir una presencia, escuchar una señal y abrir una advertencia crítica. Las ramas en movimiento son ambientales; todos los contenidos pueden activarse con botones y leerse sin depender de parallax, sonido o color. Una ruta nunca obliga a aceptar una interpretación antes de mostrar su contexto.`,
      tradition:`El monte funciona como ambiente narrativo porque concentra visibilidad reducida, desorientación, quiebres del sendero, sonidos y encuentros. El Trauco y la Fiura se estudian como figuras distintas, no como una pareja automáticamente definida. La V6 permite asociar al Trauco con senderos, peligro y explicación social, y a la Fiura con fuerza, aliento y presencia femenina del bosque. Sus apariencias, poderes y parentescos continúan pendientes de fuentes específicas. El tratamiento crítico no elimina el relato: explica que algunas versiones han sido utilizadas para narrar sexualidad, violencia o responsabilidad y que una exposición contemporánea no debe repetirlas de manera culpabilizadora. El Chucao introduce otra clase de contenido. Es un ave real; convertir su canto en señal cultural no lo transforma en ser sobrenatural. Dirección, contexto y valoración pueden cambiar, de modo que la interfaz evita un indicador simple de buena o mala suerte. Raiquén y Piuchén muestran una tercera situación: nombres o figuras presentes en repertorios, pero todavía sin respaldo suficiente para conducir la experiencia. Permanecen visibles porque una enciclopedia también debe mostrar sus límites. Al reunir criaturas, aves y preguntas abiertas, el capítulo enseña que “presagio” describe una interpretación de signos y no una propiedad objetiva comprobada del animal o del paisaje. La futura revisión deberá distinguir fuentes etnográficas, compilaciones literarias y divulgación, porque cada género puede describir las figuras con objetivos y lenguajes diferentes. Ese contraste debe quedar visible.`,
      closure:`El Folio se integra cuando la persona diferencia al Trauco de la Fiura, al Chucao de una criatura sobrenatural y una señal cultural de una regla universal. La mediación crítica queda como parte del conocimiento, no como una advertencia exterior que interrumpe el relato. El mundo puede repasarse después sin volver a atravesar sus senderos.`},
    {chapterId:'waters',
      threshold:`La escena se lee como un mapa de rastros. El surco atraviesa el mallín, el barro rodea el corral y una superficie oscura permanece en el agua quieta. Cada marca posee alternativa textual y conduce a una ficha distinta; ninguna exige adivinar una criatura por su silueta. El orden de exploración es libre porque el aprendizaje surge de comparar ambientes. Nada se fusiona automáticamente.`,
      tradition:`Las aguas interiores forman un dominio educativo sólo si se conservan sus diferencias. El Camahueto se vincula con terreno húmedo, fuerza, cuerno y surco. Las propiedades curativas o destructivas atribuidas al cuerno pertenecen a variantes que no deben convertirse en indicaciones prácticas. El Cuchivilu se reconoce en otro ambiente: estero, barro y corral de pesca alterado. La V7 habla de alteración porque ese término aparece en la síntesis disponible; no añade contaminación, enfermedades o consecuencias ecológicas sin fuente. El Cuero del Agua se relaciona con superficie, agua quieta y una acción de atrapar, pero su circulación regional más amplia obliga a mantener abierta la atribución específicamente chilota. Comparar estas figuras muestra que el ambiente no es una etiqueta secundaria. Define la señal que anuncia la presencia, el movimiento que se le atribuye y las prácticas humanas que aparecen alrededor. Mallín, estero, corral, lago o laguna tampoco se usan aquí como localizaciones cartográficas exactas. Son categorías narrativas tomadas de los contenidos de V6 y del Prompt V7. La futura investigación deberá precisar vocabulario, distribución y versiones. Mientras tanto, el museo puede enseñar con honestidad qué diferencias ya están registradas y cuáles no. También debe revisar si ciertos nombres cambian entre localidades, si los hábitats se describen con vocabulario técnico o cotidiano y qué relaciones pertenecen a compilaciones posteriores. Hasta contar con ese trabajo, la escena utiliza ambientes generales y evita puntos cartográficos precisos. La comparación conserva esos límites.`,
      closure:`La síntesis final debe emparejar correctamente Camahueto con surco y terreno húmedo, Cuchivilu con barro y corral, y Cuero con superficie y agua quieta. Además, debe reconocer que los poderes atribuidos y la circulación territorial continúan pendientes. Esa combinación de conocimiento y cautela integra el Folio. El visitante puede explicar por qué compartir agua no vuelve equivalentes a las tres figuras ni autoriza a trasladarlas de un ambiente a otro. Quedan abiertas futuras revisiones.`},
    {chapterId:'recta',
      threshold:`Los cajones pueden abrirse en cualquier orden, pero conservan etiquetas permanentes. El papel claro corresponde al plano histórico pendiente de referencias; el sello oscuro, a la organización legendaria; la cueva, a figuras asociadas; la última hoja, a cultura posterior y recreación. Ningún cajón se completa marcando una fuente genérica.`,
      tradition:`La Recta Provincia requiere una lectura más profunda porque la presencia de historia documentada puede inducir a tratar toda la leyenda como documento. La V7 evita ese salto. El primer cajón reconoce que existen procesos y materiales históricos, pero no ofrece nombres, fechas, acusaciones ni expedientes porque los archivos recibidos no los contienen. La matriz curatorial enumera esos faltantes para una etapa de investigación. El segundo cajón reúne organización legendaria: tribunales, jurisdicciones, jerarquías, mensajeros, castigos y lugares secretos sólo podrán detallarse cuando una fuente los sostenga. El tercero estudia figuras. Voladora representa mensajería y movilidad nocturna en la síntesis de V6; Invunche, custodia, cueva y secreto. Chonchón o Tuetué y Basilisco permanecen como comparaciones con circulación o relación todavía por delimitar. El cuarto cajón reconoce la cultura posterior: literatura, divulgación, imágenes y este propio Grimorio producen nuevas formas de imaginar el conjunto. La exposición no niega que los registros se influyan entre sí. Enseña que influencia no significa equivalencia. Una novela puede usar un proceso histórico; una ilustración puede volver visible un motivo legendario; una tradición puede conservar nombres que luego aparecen en divulgación. Para estudiar esas transferencias se necesitan citas y cronologías futuras, no una mezcla indiferenciada. Una fase posterior también deberá revisar el vocabulario histórico utilizado en expedientes y distinguirlo de los nombres con que la divulgación resume el fenómeno. Esa comparación puede revelar cambios de significado sin convertir categorías judiciales y legendarias en sinónimos. La matriz mantiene esos límites visibles.`,
      closure:`El Tribunal entrega el Folio cuando cada afirmación encuentra una columna adecuada y el visitante puede explicar por qué faltan detalles concretos. Invunche deja de ser obstáculo y se vuelve figura de custodia; Voladora se comprende como mensajera legendaria; el expediente histórico permanece abierto a fuentes reales. La síntesis no resuelve el archivo: enseña a formular mejor sus preguntas.`},
    {chapterId:'dead-roads',
      threshold:`Cuatro faroles separan costa, camino, memoria y criterio de cuidado. Pueden abrirse sin sonido y no contienen voces imitadas. La atmósfera de lluvia es una capa artística que puede pausarse; los textos nunca dependen de ella para ser comprendidos. La oscuridad crea tono, pero no esconde controles ni información necesaria. Cada farol conserva una función distinta.`,
      tradition:`El último dominio reúne relatos de muertos sin suponer que todos cumplen la misma función. Las Ánimas de Cucao se asocian en V6 con costa occidental, viento, temporal y memoria de personas fallecidas. Falta saber qué versiones locales sostienen cada motivo y cómo desean ser atribuidas. La Condená aparece como figura de camino, pena y tránsito nocturno; su historia, causa y forma de aparición cambian. Para ordenar el aprendizaje, la V7 propone cuatro categorías. Aparición: relato de un encuentro con una presencia. Presagio: señal interpretada como advertencia o anuncio. Memoria: forma de mantener una ausencia dentro de la comunidad. Relato moral: narración que organiza conductas, culpas o precauciones. Estas categorías son herramientas curatoriales; una misma historia puede tocar más de una. El capítulo también distingue ambientación y testimonio. Las luces, lluvia y frases de la Voz del Grimorio son recreación. No pertenecen a una persona fallecida, una familia o una comunidad concreta. Incorporar voces reales exigiría consentimiento, atribución y posibilidad de conservar diferencias. Este cuidado no vuelve plana la experiencia: permite que la atmósfera acompañe al contenido sin apropiarse del duelo. Una investigación territorial debería registrar quién autoriza el uso de cada relato, qué nombres deben mantenerse reservados y cómo se relacionan las narraciones con lugares concretos. También deberá diferenciar versiones publicadas de memorias familiares contemporáneas. La plataforma deja espacio para ese trabajo y evita presentar una ausencia de fuentes como permiso para inventar voces. La revisión futura también deberá indicar si una narración funciona como recuerdo, advertencia, enseñanza moral o combinación de esas formas.`,
      closure:`El visitante integra el último Folio cuando puede explicar la diferencia entre las Ánimas como memoria colectiva y La Condená como figura de camino, y cuando reconoce que aparición, presagio y recuerdo no son sinónimos. El cierre convierte la ética de atribución en parte del aprendizaje del mundo. Reunir los Folios no clausura esas memorias: abre un lugar permanente donde estudiarlas con mayor cuidado y respeto.`}
  ]);
  const KNOWLEDGE_FRAGMENTS=Object.freeze([
    {id:'origin-rise',chapterId:'origin',title:'La tierra que responde',category:'Relato de origen',glyph:'△',body:'Tentén concentra la fuerza de elevación y refugio dentro de versiones difundidas del relato. La montaña o la tierra alta no funcionan sólo como escenario: intervienen en la supervivencia y hacen visible que el territorio posee agencia narrativa.',details:['elevación','refugio','paisaje activo'],claimIds:['cl-origin-1'],sourceIds:['memoria-chilena']},
    {id:'origin-flood',chapterId:'origin',title:'El agua que transforma',category:'Relato de origen',glyph:'▽',body:'Caicai concentra el ascenso del agua y la transformación del paisaje. La inundación puede leerse como catástrofe, conflicto y fuerza cosmogónica. El alcance exacto y las formas del nombre cambian según la versión.',details:['inundación','transformación','fuerza acuática'],claimIds:['cl-origin-2'],sourceIds:['memoria-chilena']},
    {id:'origin-change',chapterId:'origin',title:'Personas, animales y cambio',category:'Otra versión',glyph:'◇',body:'Los destinos de personas y animales no se narran de una sola manera. Algunas versiones enfatizan la salvación; otras, la transformación. La V7 conserva la diferencia y evita completar con detalles que los archivos recibidos no documentan.',details:['salvación','transformación','variación'],claimIds:['cl-origin-3'],sourceIds:[]},
    {id:'origin-landscape',chapterId:'origin',title:'Una explicación mítica del archipiélago',category:'Interpretación del recorrido',glyph:'≋',body:'La organización curatorial usa el relato para enseñar por qué tierra y mar son fuerzas activas en el resto del Grimorio. No se presenta como explicación científica ni clasificación histórica oficial.',details:['cosmogonía','insularidad','organización curatorial'],claimIds:['cl-origin-4'],sourceIds:[]},

    {id:'court-king',chapterId:'sea-court',title:'El centro de la corte',category:'Figura principal',glyph:'♆',body:'Millalobo organiza la lectura de la corte submarina como centro de autoridad y relaciones. Su importancia educativa surge de conectar figuras, no de colocarlo como una tarjeta aislada.',details:['soberanía','profundidad','red'],claimIds:['cl-court-1'],sourceIds:['memoria-chilena']},
    {id:'court-bridge',chapterId:'sea-court',title:'El tránsito de Huenchula',category:'Relación',glyph:'☽',body:'Huenchula permite pensar el paso entre mundo humano y marino. Su historia y parentescos requieren fuentes específicas; la V7 la presenta como puente narrativo y marca la genealogía como variable.',details:['tránsito','parentesco','transformación'],claimIds:['cl-court-2'],sourceIds:[]},
    {id:'court-dance',chapterId:'sea-court',title:'La danza y la abundancia',category:'Detalle del relato',glyph:'≈',body:'Pincoya aparece asociada a abundancia del mar, orilla y dirección de la danza. Las consecuencias atribuidas a esa orientación cambian entre narraciones y deben compararse antes de fijar una regla.',details:['danza','abundancia','borde'],claimIds:['cl-court-3'],sourceIds:['memoria-chilena']},
    {id:'court-network',chapterId:'sea-court',title:'Genealogía variable',category:'Otra versión',glyph:'∿',body:'Pincoy, Sirena Chilota y Caballo Marino amplían la red, pero sus funciones y parentescos no tienen el mismo respaldo en los archivos disponibles. La corriente visual distingue parentesco, asociación y comparación.',details:['Pincoy','Sirena','Caballo Marino'],claimIds:['cl-court-4'],sourceIds:[]},

    {id:'fog-lights',chapterId:'caleuche',title:'Tres luces en el canal',category:'Una señal',glyph:'✦',body:'Los faroles funcionan como señal recurrente del barco en la síntesis heredada de V6. El número tres pertenece a la recreación escénica solicitada para V7 y no se presenta como dato universal de la tradición.',details:['luz','distancia','recreación'],claimIds:['cl-fog-1'],sourceIds:['memoria-chilena']},
    {id:'fog-music',chapterId:'caleuche',title:'Música antes de la aparición',category:'Una señal',glyph:'♪',body:'La música distante acompaña la aparición del Caleuche en la versión educativa disponible. El paisaje sonoro de la interfaz es conceptual y se ofrece con transcripción; no reproduce un registro de terreno.',details:['música','escucha','transcripción'],claimIds:['cl-fog-2'],sourceIds:['memoria-chilena']},
    {id:'fog-crew',chapterId:'caleuche',title:'¿Quién navega?',category:'Otra versión',glyph:'⋮',body:'Aparecidos, navegantes transformados o personas desaparecidas pertenecen a versiones diferentes. La V7 no las fusiona en una sola tripulación y deja pendiente la referencia bibliográfica precisa de cada formulación.',details:['aparecidos','transformación','desaparición'],claimIds:['cl-fog-3'],sourceIds:[]},
    {id:'fog-secret',chapterId:'caleuche',title:'El vínculo con el secreto',category:'Relación inesperada',glyph:'⌘',body:'La asociación entre Caleuche y brujos aparece en algunas versiones registradas por la V6, no en todas. Esa conexión prepara temáticamente la Recta Provincia, pero no convierte ambos relatos en una sola historia.',details:['brujos','variante','continuidad narrativa'],claimIds:['cl-fog-4'],sourceIds:[]},

    {id:'forest-trauco',chapterId:'forest',title:'La presencia del sendero',category:'Figura principal',glyph:'♟',body:'El Trauco se vincula con monte, senderos, encuentro y peligro. Su función social y los relatos asociados a sexualidad o violencia exigen lectura crítica para no reproducir culpabilización.',details:['sendero','encuentro','mediación crítica'],claimIds:['cl-forest-1'],sourceIds:['memoria-chilena']},
    {id:'forest-fiura',chapterId:'forest',title:'La contrapresencia',category:'Figura relacionada',glyph:'❧',body:'La Fiura aparece como presencia femenina del monte asociada a fuerza, aliento y peligro. Descripciones corporales y vínculos familiares cambian entre repertorios y requieren documentación específica.',details:['fuerza','aliento','variantes'],claimIds:['cl-forest-2'],sourceIds:[]},
    {id:'forest-chucao',chapterId:'forest',title:'Ave real, lectura cultural',category:'Una señal',glyph:'⌁',body:'El Chucao es un ave; las lecturas de su canto y dirección pertenecen a prácticas culturales variables. La interfaz evita presentar una regla única de buen o mal presagio.',details:['canto','dirección','contexto'],claimIds:['cl-forest-3'],sourceIds:['patrimonio-cultural']},
    {id:'forest-open',chapterId:'forest',title:'Archivo abierto del monte',category:'Pregunta abierta',glyph:'⌄',body:'Raiquén y Piuchén permanecen como entradas provisionales. Sus nombres, atributos y circulación territorial necesitan revisión antes de ocupar un lugar principal en la narración.',details:['Raiquén','Piuchén','validación'],claimIds:['cl-forest-4'],sourceIds:[]},

    {id:'waters-skin',chapterId:'waters',title:'La superficie engañosa',category:'Otra versión',glyph:'◇',body:'El Cuero del Agua se describe como piel o superficie capaz de atrapar. Su circulación pertenece a un imaginario del sur más amplio; la atribución específicamente chilota sigue pendiente de delimitación.',details:['agua quieta','superficie','circulación regional'],claimIds:['cl-waters-3'],sourceIds:[]},

    {id:'tenten',name:'Tentén Vilu',alternativeNames:[],worldId:'origin',nature:'Serpiente mítica vinculada a la tierra',territories:['Archipiélago de Chiloé'],glyph:'△',primary:true,
      shortDefinition:'Figura del relato de origen asociada a la elevación de la tierra, el refugio y la respuesta frente al ascenso del agua.',

      appearance:'La V7 no fija una apariencia documental. La escena utiliza una serpiente terrestre estilizada como decisión artística.',signals:['tierra elevada','altura','refugio','paisaje transformado'],attributedPowers:['elevar o proteger la tierra según versiones'],behaviour:['responde al avance del agua','se opone a Caicai dentro del relato'],associatedPlaces:['alturas','paisaje insular'],relationships:['caicai'],variants:['énfasis en salvación','énfasis en formación mítica del paisaje','destinos variables de personas y animales'],curiousFacts:['cf1','cf2','cf3','cf4'],interpretations:['El paisaje funciona como fuerza narrativa.'],culturalPresence:['Recreaciones contemporáneas de la cosmogonía'],sourceIds:['memoria-chilena'],claimIds:['cl-origin-1','cl-origin-3'],illustrationId:'origin',curatorialStatus:'provisional',pendingReview:'Comparar nombres, ediciones, páginas y versiones territoriales.'},
    {id:'caicai',name:'Caicai Vilu',alternativeNames:[],worldId:'origin',nature:'Serpiente mítica vinculada al agua',territories:['Archipiélago de Chiloé'],glyph:'▽',primary:true,
      shortDefinition:'Figura acuática del relato de origen asociada al ascenso del mar, la inundación y la transformación del territorio.',
      narrativeIntroduction:'Bajo la superficie, una segunda forma se curva y empuja la marea. La escena no afirma cómo “era” Caicai: vuelve visible la potencia del agua para que el visitante compare su función con la de Tentén.',
      traditionalAccount:'Caicai Vilu concentra en la V6 la fuerza acuática del relato de origen. El agua asciende, amenaza o transforma; frente a ella, la tierra se eleva. Esta relación ofrece una lectura mítica del archipiélago, las alturas y el océano. La V7 insiste en que no se trata de una descripción científica ni de una cronología factual. Es una cosmogonía con variantes. El conflicto no debe reducirse a bien contra mal: ambas figuras expresan fuerzas del paisaje y su tensión produce cambio. Algunas versiones pueden concentrarse en la catástrofe; otras, en las transformaciones o en el carácter insular. Sin bibliografía específica no se completan detalles de personas, animales o desenlace.',

    {id:'millalobo',name:'Millalobo',alternativeNames:[],worldId:'sea-court',nature:'Soberano del imaginario submarino',territories:['Mar y canales de Chiloé'],glyph:'♆',primary:true,
      shortDefinition:'Figura central de la corte marina, útil para comprender jerarquías, parentescos y relaciones dentro del imaginario submarino.',
      narrativeIntroduction:'Las corrientes de la escena convergen en una figura central. Antes de revelar su nombre, el Grimorio muestra que cada presencia marina ocupa una posición relativa: no existe una corte sin relaciones.',
      traditionalAccount:'Millalobo aparece en la síntesis de V6 como soberano de las criaturas marinas. Su figura permite organizar un mundo bajo el agua donde autoridad, parentesco y función se conectan. La V7 lo presenta como centro de una red con Huenchula, Pincoya y Pincoy, pero marca esa genealogía como variable. No todos los repertorios describen del mismo modo sus vínculos, y los archivos recibidos no aportan la fuente específica para fijarlos. Por eso el encuentro culminante no pide memorizar un árbol familiar; pide distinguir una relación documentada de una asociación curatorial y reconocer que Pincoya, Pincoy y Huenchula poseen funciones propias. La corte se lee como una forma de imaginar el océano con orden social, tránsito y abundancia.',
      appearance:'Figura coral y soberana en la escena submarina; los rasgos son recreación artística.',signals:['profundidad','corrientes convergentes','red de parentescos'],attributedPowers:['autoridad sobre el mundo marino según repertorios'],behaviour:['organiza la corte','conecta figuras marinas'],associatedPlaces:['reino submarino','canales'],relationships:['huenchula','pincoya','pincoy'],variants:['genealogías diferentes','corte como familia o como orden simbólico'],curiousFacts:['cf5','cf6'],interpretations:['La corte enseña relaciones, no una lista de seres.'],culturalPresence:['Divulgación de mitología chilota'],sourceIds:['memoria-chilena'],claimIds:['cl-court-1'],illustrationId:'sea-court',curatorialStatus:'provisional',pendingReview:'Documentar genealogías y funciones con ediciones y páginas.'},
    {id:'huenchula',name:'Huenchula',alternativeNames:[],worldId:'sea-court',nature:'Figura de tránsito y parentesco',territories:['Mundo humano y marino en los relatos'],glyph:'☽',primary:true,
      shortDefinition:'Figura que enlaza el mundo humano con la corte marina y permite leer transformación, pérdida y parentesco.',
      narrativeIntroduction:'Entre la superficie y la profundidad aparece una figura que no pertenece por completo a una sola capa. Su lugar en la escena es el tránsito.',
      traditionalAccount:'La V6 describe a Huenchula como figura humana ligada al linaje del mundo marino y a Millalobo. Esa síntesis permite explicar por qué la corte no se limita a criaturas nacidas bajo el agua: también contiene historias de paso y transformación. La V7 no completa una biografía ni un parentesco definitivo porque faltan fuentes específicas. En cambio, utiliza su presencia para enseñar que una genealogía mítica puede cambiar entre narradores y compilaciones. Huenchula conecta los temas de pérdida, despedida, parentesco y cruce de dominios sin afirmar detalles no respaldados.',
      appearance:'Silueta situada entre dos profundidades; interpretación artística.',signals:['tránsito','parentesco','transformación'],attributedPowers:[],behaviour:['enlaza dominios en la lectura del relato'],associatedPlaces:['borde entre tierra y mar'],relationships:['millalobo','pincoya','pincoy'],variants:['historia y parentescos variables'],curiousFacts:['cf6'],interpretations:['Figura-puente dentro de la organización curatorial.'],culturalPresence:['Repertorios de la corte marina'],sourceIds:['pending-bibliography'],claimIds:['cl-court-2'],illustrationId:'sea-court',curatorialStatus:'pending',pendingReview:'Fuente específica para historia, parentescos y transformaciones.'},
    {id:'pincoya',name:'Pincoya',alternativeNames:[],worldId:'sea-court',nature:'Presencia marina asociada a abundancia',territories:['Playas y bordes marinos'],glyph:'≈',primary:true,
      shortDefinition:'Figura del mar vinculada a la danza, la abundancia y la relación entre comunidades y borde costero.',
      narrativeIntroduction:'Una corriente más clara recorre la orilla. La figura no aparece inmóvil: la escena la entiende a través del movimiento y de la dirección.',
      traditionalAccount:'Pincoya aparece en V6 asociada a fertilidad o abundancia del mar y a una danza cuya dirección se interpreta de formas distintas. La V7 evita convertir esa relación en una regla mecánica universal. Enseña que orientación, consecuencia y contexto cambian según la versión. Su relación con pesca, recolección y cuidado del borde pertenece al marco educativo del capítulo y necesita fuentes específicas para cada afirmación concreta. Pincoya también permite diferenciar una figura de su red: Pincoy no es simplemente otro nombre, y Millalobo y Huenchula ocupan posiciones distintas. La danza se vuelve una herramienta para hablar de dependencia del mar, escasez, abundancia y responsabilidad sin fingir una cita tradicional.',
      appearance:'Figura danzante en el borde de una corriente; recreación artística.',signals:['danza','orientación','orilla','abundancia'],attributedPowers:['anunciar o influir en abundancia según versiones'],behaviour:['danza','se relaciona con el borde marino'],associatedPlaces:['playas','orillas','costa interior'],relationships:['millalobo','huenchula','pincoy'],variants:['dirección de la danza','consecuencias atribuidas','relación con Pincoy'],curiousFacts:['cf7','cf8'],interpretations:['La abundancia también invita a pensar el cuidado del borde.'],culturalPresence:['Representaciones artísticas y divulgativas'],sourceIds:['memoria-chilena'],claimIds:['cl-court-3'],illustrationId:'sea-court',curatorialStatus:'provisional',pendingReview:'Comparar versiones de la danza y sus consecuencias.'},
    {id:'pincoy',name:'Pincoy',alternativeNames:[],worldId:'sea-court',nature:'Presencia marina relacionada con Pincoya',territories:['Mar y costa interior'],glyph:'∿',primary:false,

    {id:'sirena',name:'Sirena Chilota',alternativeNames:[],worldId:'sea-court',nature:'Presencia acuática asociada al canto',territories:['Roqueríos y canales'],glyph:'♪',primary:false,

    {id:'caleuche',name:'Caleuche',alternativeNames:['El Caleuche'],worldId:'caleuche',nature:'Barco encantado',territories:['Canales y mar nocturno'],glyph:'⚓',primary:true,

    {id:'trauco',name:'Trauco',alternativeNames:['El Trauco'],worldId:'forest',nature:'Presencia del monte',territories:['Bosque húmedo y senderos'],glyph:'♟',primary:true,
      shortDefinition:'Figura del monte asociada a encuentro, peligro y explicaciones sociales que requieren mediación crítica.',

    {id:'fiura',name:'Fiura',alternativeNames:['La Fiura'],worldId:'forest',nature:'Presencia femenina del monte',territories:['Bosque y quebradas'],glyph:'❧',primary:true,

      appearance:'Figura entre follaje rojizo; recreación artística sin pretensión documental.',signals:['bosque','aliento','fuerza'],attributedPowers:['fuerza y efectos atribuidos según versiones'],behaviour:['aparece en el monte'],associatedPlaces:['quebradas','bosque húmedo'],relationships:['trauco'],variants:['apariencia','parentesco','efectos del aliento'],curiousFacts:['cf14'],interpretations:['Lectura crítica de descripción corporal y moral.'],culturalPresence:['Repertorios del monte'],sourceIds:['pending-bibliography'],claimIds:['cl-forest-2'],illustrationId:'fiura',curatorialStatus:'pending',pendingReview:'Fuente específica y revisión crítica de representaciones.'},
    {id:'chucao',name:'Chucao',alternativeNames:[],worldId:'forest',nature:'Ave real y señal cultural',territories:['Bosque y senderos'],glyph:'⌁',primary:false,

    {id:'camahueto',name:'Camahueto',alternativeNames:['El Camahueto'],worldId:'waters',nature:'Animal portentoso de un cuerno',territories:['Mallines y terrenos húmedos'],glyph:'♘',primary:true,

    {id:'cuchivilu',name:'Cuchivilu',alternativeNames:['El Cuchivilu'],worldId:'waters',nature:'Presencia anfibia de estero',territories:['Esteros y corrales de pesca'],glyph:'ϟ',primary:true,

      narrativeIntroduction:'El barro del estero aparece removido y el cerco del corral pierde su forma. La escena muestra consecuencias antes que criatura.',
      traditionalAccount:'La V6 asocia al Cuchivilu con esteros, barro y alteración de corrales de pesca. La V7 reemplaza el lenguaje de enfrentamiento de versiones antiguas por observación del hábitat. No afirma contaminación como hecho ni describe una ecología real de la criatura. Enseña que prácticas costeras y señales del ambiente forman parte del relato. Aspecto, origen y efectos cambian y requieren fuentes específicas.',
      appearance:'Rastro anfibio sugerido bajo el barro; no se fija una anatomía.',signals:['barro removido','agua alterada','corral afectado'],attributedPowers:['alterar el entorno según relatos'],behaviour:['se revuelca o desplaza en esteros según versiones'],associatedPlaces:['estero','corral de pesca'],relationships:['camahueto','cuero-agua'],variants:['aspecto','efectos'],curiousFacts:['cf18'],interpretations:['El ambiente narrativo importa tanto como la criatura.'],culturalPresence:['Repertorios de aguas interiores'],sourceIds:['pending-bibliography'],claimIds:['cl-waters-2'],illustrationId:'waters',curatorialStatus:'pending',pendingReview:'Documentar versiones de aspecto, conducta y relación con corrales.'},
    {id:'cuero-agua',name:'Cuero del Agua',alternativeNames:['El Cuero'],worldId:'waters',nature:'Presencia acuática de superficie',territories:['Lagos o aguas quietas; circulación regional'],glyph:'◇',primary:true,
      shortDefinition:'Presencia descrita como piel o superficie que atrapa, con circulación más amplia que Chiloé.',
      narrativeIntroduction:'El agua parece inmóvil hasta que una superficie se pliega. La V7 representa el peligro sin afirmar que una forma visual sea canónica.',
      traditionalAccount:'La V6 conserva el Cuero como presencia acuática descrita semejante a una piel extendida capaz de atrapar. También advierte que pertenece a un imaginario más amplio del sur y que la atribución específicamente chilota debe delimitarse. La V7 mantiene esa cautela en primer plano de la ficha, no en cada escena. Su función educativa es diferenciar agua quieta, superficie y emboscada de los rastros de Camahueto y Cuchivilu.',

    {id:'brujo',name:'Brujo de la Recta Provincia',alternativeNames:[],worldId:'recta',nature:'Figura histórica, acusatoria y legendaria',territories:['Quicaví y geografía imaginada; detalle pendiente'],glyph:'⌘',primary:true,
      shortDefinition:'Figura situada entre procesos históricos, tradición legendaria y recreaciones posteriores, que exige distinguir registros.',
      narrativeIntroduction:'El expediente no abre con una criatura, sino con una pregunta: ¿qué parte de lo que ves pertenece a documento, qué parte a tradición y qué parte al museo?',
      traditionalAccount:'La V6 reconoce un complejo histórico y legendario asociado a la Recta Provincia. Existen procesos y documentación, pero los archivos recibidos no contienen expedientes, fechas, personas ni citas específicas. Al mismo tiempo, la tradición atribuye organización, jerarquías, tribunales y poder secreto. La V7 no fusiona ambos planos. El “brujo” funciona como figura de cruce: puede aparecer en acusaciones históricas, en organización legendaria y en recreaciones culturales posteriores. Cada afirmación debe declarar su columna. El encuentro del Tribunal no reproduce un proceso real; es una síntesis educativa que obliga a clasificar registros.',
      appearance:'Figura de expediente y sombra; no representa a una persona histórica concreta.',signals:['secreto','organización','jurisdicción legendaria','archivo'],attributedPowers:['atribuciones variables en relatos'],behaviour:['participa en redes legendarias según versiones'],associatedPlaces:['Quicaví en registros históricos y legendarios'],relationships:['voladora','invunche','chonchon','caleuche','basilisco'],variants:['jerarquías','prácticas','relación con Caleuche'],curiousFacts:['cf21','cf22','cf23','cf24'],interpretations:['La coexistencia de registros es el contenido central.'],culturalPresence:['Literatura y divulgación por investigar'],sourceIds:['memoria-chilena'],claimIds:['cl-recta-1','cl-recta-2'],illustrationId:'recta',curatorialStatus:'provisional',pendingReview:'Incorporar expedientes, fechas, nombres y bibliografía verificable.'},
    {id:'voladora',name:'Voladora',alternativeNames:['La Voladora'],worldId:'recta',nature:'Mensajera legendaria',territories:['Rutas nocturnas en relatos de secreto'],glyph:'⌃',primary:true,
      shortDefinition:'Figura asociada a mensajería, transformación y comunicación secreta dentro del registro legendario.',
      narrativeIntroduction:'Una hoja del expediente llega antes que quien la transporta. El Grimorio usa ese gesto como recreación para introducir la función de mensajería.',
      traditionalAccount:'La V6 describe a la Voladora como mensajera asociada a relatos de brujería chilota, movilidad nocturna y transformación corporal. La V7 mantiene esas atribuciones en el registro de tradición pendiente, porque no existe una referencia específica para cada una. Su función se compara con la del Invunche: ella conecta y transporta; él guarda y restringe. Esta diferencia permite comprender una organización legendaria sin presentar sus cargos o prácticas como hechos documentados.',
      appearance:'Silueta de movimiento nocturno; recreación artística.',signals:['mensaje','noche','transformación'],attributedPowers:['transformación y vuelo atribuidos'],behaviour:['transporta mensajes según relatos'],associatedPlaces:['rutas nocturnas'],relationships:['brujo','invunche','chonchon'],variants:['forma','función','relación con mensajeros'],curiousFacts:['cf23'],interpretations:['Figura de comunicación dentro de una red legendaria.'],culturalPresence:['Recreaciones visuales y literarias por investigar'],sourceIds:['pending-bibliography'],claimIds:['cl-recta-3'],illustrationId:'invunche-voladora',curatorialStatus:'pending',pendingReview:'Fuente específica para funciones y transformaciones.'},
    {id:'invunche',name:'Invunche',alternativeNames:['El Invunche'],worldId:'recta',nature:'Guardián legendario',territories:['Cueva y espacios de custodia en relatos'],glyph:'⌇',primary:true,
      shortDefinition:'Figura vinculada a cueva, custodia y secreto que funciona como guardián del umbral de la Recta Provincia.',
      narrativeIntroduction:'La cueva no se abre al tocarla. Primero hay que reconocer que la figura del umbral pertenece a la tradición legendaria y que su cuerpo representado es una decisión artística.',
      traditionalAccount:'El Invunche aparece en V6 asociado a cueva, secreto y custodia. Su imagen corporal perturbadora forma parte de relatos y recreaciones, no de una descripción documental de una persona real. La V7 evita explotarla como horror corporal y concentra la lectura en su función de guardián. En el capítulo, custodia el acceso simbólico al Tribunal legendario. No se lo vence: el visitante cruza el umbral cuando distingue documento, tradición y arte. Origen, transformación y función cambian entre compilaciones y necesitan referencias específicas.',
      appearance:'Silueta parcial en la entrada de una cueva; representación artística prudente.',signals:['cueva','custodia','secreto','umbral'],attributedPowers:['funciones de guarda atribuidas'],behaviour:['custodia un acceso según relatos'],associatedPlaces:['cueva','espacio oculto'],relationships:['brujo','voladora'],variants:['origen','función','representación corporal'],curiousFacts:['cf23'],interpretations:['Guardián del umbral como síntesis educativa.'],culturalPresence:['Literatura e imagen popular por investigar'],sourceIds:['memoria-chilena'],claimIds:['cl-recta-3'],illustrationId:'invunche-voladora',curatorialStatus:'provisional',pendingReview:'Edición, página y comparación de representaciones.'},
    {id:'chonchon',name:'Chonchón / Tuetué',alternativeNames:['Tuetué'],worldId:'recta',nature:'Presencia nocturna comparativa',territories:['Circulación regional; vínculo chilote pendiente'],glyph:'◉',primary:false,

      appearance:'Símbolo nocturno, no anatomía fijada.',signals:['vuelo','noche','llamado'],attributedPowers:['transformación atribuida'],behaviour:[],associatedPlaces:['circulación regional'],relationships:['brujo','voladora'],variants:['nombre','apariencia','atribución'],curiousFacts:[],interpretations:['Comparación entre repertorios regionales.'],culturalPresence:[],sourceIds:['pending-bibliography'],claimIds:[],illustrationId:'invunche-voladora',curatorialStatus:'pending',pendingReview:'Validar circulación y vínculos locales.'},
    {id:'basilisco',name:'Basilisco',alternativeNames:['Basilisco Chilote'],worldId:'recta',nature:'Presencia doméstica comparativa',territories:['Casa y rincones oscuros en repertorios'],glyph:'⊙',primary:false,
      shortDefinition:'Figura asociada a nacimiento extraordinario, casa y enfermedad atribuida, con vínculo variable respecto de la Recta Provincia.',
      narrativeIntroduction:'Una marca doméstica aparece al margen del expediente principal.',
      traditionalAccount:'La V6 conserva al Basilisco como archivo comparativo. Su relación exacta con la Recta Provincia no debe asumirse igual en todas las versiones. La V7 lo mantiene en Biblioteca y no lo convierte en pieza necesaria del encuentro.',
      appearance:'Símbolo circular de representación artística.',signals:['casa','mirada','enfermedad atribuida'],attributedPowers:['efectos atribuidos según versiones'],behaviour:['se oculta cerca de viviendas según repertorios'],associatedPlaces:['casa'],relationships:['brujo'],variants:['origen','efectos','vínculo con Recta Provincia'],curiousFacts:[],interpretations:['Figura comparativa del secreto doméstico.'],culturalPresence:[],sourceIds:['pending-bibliography'],claimIds:[],illustrationId:'recta',curatorialStatus:'pending',pendingReview:'Fuente específica y relación documental.'},
    {id:'animas-cucao',name:'Ánimas de Cucao',alternativeNames:[],worldId:'dead-roads',nature:'Presencias de memoria y fallecidos',territories:['Costa occidental y Cucao'],glyph:'⋮',primary:true,
      shortDefinition:'Relatos asociados a costa occidental, temporales, muertos y formas comunitarias de memoria.',
      narrativeIntroduction:'Pequeñas luces aparecen en la costa, pero ninguna reclama el nombre de una persona real. La escena es una recreación que evita suplantar testimonios.',
      traditionalAccount:'La V6 reúne motivos de muertos, temporales y memoria del borde occidental bajo la entrada Ánimas de Cucao. También advierte que no pretende fijar una sola versión. La V7 profundiza esa cautela: distingue aparición, advertencia y memoria, y no atribuye palabras a fallecidos ni familias. La costa abierta, el viento y el temporal se presentan como paisaje narrativo. Cualquier versión territorial futura deberá contar con autorización, atribución y fuente. El encuentro colectivo pide reconocer funciones del relato, no identificar espectros.',
      appearance:'Luces y sombras costeras; recreación respetuosa.',signals:['costa','viento','temporal','luces de memoria'],attributedPowers:[],behaviour:['aparecen o son recordadas según relatos'],associatedPlaces:['Cucao','costa occidental'],relationships:['condena'],variants:['aparición','advertencia','memoria familiar'],curiousFacts:['cf25','cf27','cf28'],interpretations:['La mitología también conserva ausencia y duelo.'],culturalPresence:['Relatos familiares pendientes de autorización'],sourceIds:['pending-bibliography'],claimIds:['cl-dead-1','cl-dead-3','cl-dead-4'],illustrationId:'dead-roads',curatorialStatus:'pending',pendingReview:'Testimonios autorizados, versiones locales y bibliografía.'},
    {id:'condena',name:'La Condená',alternativeNames:['Condenada'],worldId:'dead-roads',nature:'Aparición de camino',territories:['Caminos nocturnos; circulación local por validar'],glyph:'†',primary:true,
      shortDefinition:'Figura de pena y tránsito asociada a caminos nocturnos, con motivos y formas variables.',
      narrativeIntroduction:'Una silueta ocupa el camino, pero el Grimorio no completa su historia. Pregunta qué hace una aparición dentro del relato.',
      traditionalAccount:'La V6 presenta La Condená como aparición femenina vinculada con condena, pena y tránsito nocturno. Sus variantes pueden advertir sobre secretos, culpas o encuentros, pero los archivos disponibles no permiten elegir un motivo definitivo. La V7 elimina cualquier biografía inventada y organiza su ficha alrededor de función, ambiente y variación. Se la compara con las Ánimas de Cucao para diferenciar una figura del sendero de una memoria colectiva de la costa.',
      appearance:'Silueta lejana sobre el camino; recreación artística.',signals:['camino','noche','pena','encuentro'],attributedPowers:[],behaviour:['aparece o transita según variantes'],associatedPlaces:['cruces','senderos'],relationships:['animas-cucao'],variants:['motivo de la condena','forma de aparición','función moral'],curiousFacts:['cf26','cf27'],interpretations:['El relato de camino puede funcionar como advertencia.'],culturalPresence:['Relatos locales por documentar'],sourceIds:['pending-bibliography'],claimIds:['cl-dead-2','cl-dead-3'],illustrationId:'dead-roads',curatorialStatus:'pending',pendingReview:'Validar circulación, nombre y versiones.'}

  const GUARDIAN_ENCOUNTERS=Object.freeze([
    {id:'guardian-origin',chapterId:'origin',guardianIds:['tenten','caicai'],title:'Dos fuerzas, un territorio',epithet:'Tentén Vilu y Caicai Vilu',glyph:'△▽',requiredFragmentIds:['origin-rise','origin-flood','origin-change'],
      opening:'La marea cubre la mitad del paisaje y las dos serpientes se vuelven visibles al mismo tiempo. El encuentro no pregunta cuál es “buena” o “mala”. Pide reconstruir la lógica del relato: agua que asciende, tierra que se eleva, vidas que buscan refugio y transformaciones que cambian según la versión. Cada elección abre una explicación; puede corregirse sin perder el progreso.',
      phases:[
        {id:'or-p1',prompt:'¿Qué relación organiza el núcleo del relato?',choices:[{id:'a',label:'Tierra y agua actúan como fuerzas en tensión',response:'Esta lectura reúne elevación e inundación sin reducir el relato a un decorado.'},{id:'b',label:'Una criatura reemplaza por completo a la otra',response:'Las versiones disponibles se comprenden mejor como oposición y relación; puedes revisar la alternativa anterior.'},{id:'c',label:'El paisaje no influye',response:'El paisaje es precisamente el núcleo educativo de esta cosmogonía. Puedes cambiar tu elección.'}]},
        {id:'or-p2',prompt:'¿Qué debe conservar el Folio sobre personas y animales?',choices:[{id:'a',label:'Que el desenlace cambia entre versiones',response:'La V7 conserva la variación y evita completar detalles sin fuente.'},{id:'b',label:'Una transformación única para todos',response:'Los archivos disponibles no permiten fijar un desenlace universal.'},{id:'c',label:'Sólo la imagen de las serpientes',response:'La escena es interpretación; el Folio debe conservar la idea y sus variantes.'}]},
        {id:'or-p3',prompt:'¿Qué explica el paso al siguiente mundo?',choices:[{id:'a',label:'El territorio emergido queda rodeado por un mar con orden propio',response:'La conexión convierte el origen en puerta hacia la corte marina.'},{id:'b',label:'Los capítulos no están conectados',response:'El lore de V7 existe para mostrar continuidad entre dominios.'},{id:'c',label:'La tierra elimina al mar',response:'El resto del Grimorio depende de que tierra y mar continúen relacionados.'}]}
      ],
      resolution:'Cuando las respuestas distinguen fuerza, variante y continuidad, las dos figuras dejan de luchar por el primer plano. El paisaje queda entre ambas. El Folio del Origen se integra como una síntesis: Tentén se reconoce por la elevación y el refugio; Caicai, por el ascenso del agua y la transformación; ninguna representación visual reemplaza la comparación de versiones.',folioId:'folio-origin'},
    {id:'guardian-court',chapterId:'sea-court',guardianIds:['millalobo'],title:'La red bajo la marea',epithet:'Millalobo, soberano de relaciones variables',glyph:'♆',requiredFragmentIds:['court-king','court-bridge','court-dance'],
      opening:'Las corrientes se reúnen y Millalobo aparece en el centro. No exige un árbol familiar perfecto, porque los archivos no sostienen una genealogía única. El encuentro pide distinguir funciones: quién actúa como soberano, quién enlaza tierra y mar, quién representa danza y abundancia, y qué figuras permanecen en archivo abierto. La corte se reconstruye como red educativa.',
      phases:[
        {id:'co-p1',prompt:'¿Cómo debe entenderse a Millalobo?',choices:[{id:'a',label:'Como centro de una red marina',response:'La figura gana sentido al conectarse con otras presencias.'},{id:'b',label:'Como única criatura relevante',response:'La corte perdería parentescos, tránsito y abundancia.'},{id:'c',label:'Como dato histórico comprobado',response:'La V7 lo mantiene en el registro de tradición.'}]},
        {id:'co-p2',prompt:'¿Qué aporta Huenchula?',choices:[{id:'a',label:'Un tránsito entre mundo humano y marino',response:'Su posición enseña transformación y parentesco variable.'},{id:'b',label:'Una genealogía fija y validada',response:'La genealogía específica sigue pendiente.'},{id:'c',label:'Sólo decoración de la escena',response:'Su función es conectar dominios, no llenar espacio.'}]},
        {id:'co-p3',prompt:'¿Qué diferencia a Pincoya de Pincoy?',choices:[{id:'a',label:'Pincoya posee un núcleo propio de danza y abundancia',response:'Pincoy se conserva relacionado, pero su función exacta sigue abierta.'},{id:'b',label:'Son nombres equivalentes',response:'La enciclopedia los mantiene como entradas distintas.'},{id:'c',label:'No existe relación alguna',response:'La relación aparece, aunque sus términos requieran documentación.'}]}
      ],
      resolution:'Millalobo no entrega el Folio por obediencia, sino cuando la corte deja de verse como catálogo. El visitante reconoce soberanía, tránsito, danza, abundancia y zonas de incertidumbre. El Folio de la Marea conserva una red flexible, capaz de mostrar lo que se sabe y lo que aún debe investigarse.',folioId:'folio-tide'},
    {id:'guardian-caleuche',chapterId:'caleuche',guardianIds:['caleuche'],title:'La aparición completa',epithet:'Caleuche, barco de señales y versiones',glyph:'⚓',requiredFragmentIds:['fog-lights','fog-music','fog-crew'],
      opening:'Las tres luces se alinean y la niebla revela una cubierta. La música no aumenta el peligro: aumenta la pregunta. El Caleuche aparece cuando el visitante ya conoce sus señales y sabe que su tripulación no posee una sola versión. El encuentro compara aparición, transformación y asociación con el secreto sin convertir ninguna variante en respuesta definitiva.',
      phases:[
        {id:'ca-p1',prompt:'¿Qué permite reconocerlo antes de verlo?',choices:[{id:'a',label:'Luces, música y niebla',response:'Las señales construyen presencia antes que anatomía.'},{id:'b',label:'Una bandera única',response:'Ese atributo no existe en los archivos recibidos.'},{id:'c',label:'Una ruta cartográfica fija',response:'El relato se asocia con aparición y desplazamiento extraordinario.'}]},
        {id:'ca-p2',prompt:'¿Quiénes viajan a bordo?',choices:[{id:'a',label:'La respuesta cambia según la versión',response:'Aparecidos, transformados y desaparecidos deben mantenerse separados.'},{id:'b',label:'Una tripulación históricamente registrada',response:'No hay respaldo específico para esa afirmación.'},{id:'c',label:'Sólo brujos en todas las versiones',response:'La asociación con brujos es variable.'}]},
        {id:'ca-p3',prompt:'¿Qué es la imagen completa del barco?',choices:[{id:'a',label:'Una recreación artística del Grimorio',response:'La escena ayuda a aprender, pero no prueba cómo “era” el Caleuche.'},{id:'b',label:'Un documento patrimonial',response:'El slot visual todavía espera una obra acreditada.'},{id:'c',label:'Una cita visual tradicional',response:'No se atribuye a una voz o fuente específica.'}]}
      ],
      resolution:'El barco vuelve a internarse en la bruma, pero ya no desaparece de la comprensión. El Folio conserva señales, variantes y límites de la imagen. Reconocer al Caleuche significa saber qué se repite y qué cambia, no elegir una tripulación para cerrar el misterio.',folioId:'folio-fog'},
    {id:'guardian-forest',chapterId:'forest',guardianIds:['trauco','fiura'],title:'El sendero que se bifurca',epithet:'Trauco y Fiura; el monte como señal y relato social',glyph:'♟❧',requiredFragmentIds:['forest-trauco','forest-fiura','forest-chucao'],
      opening:'Las ramas se cierran y el Trauco aparece al fondo del sendero. La Fiura ocupa otro ramal; el canto del Chucao permanece fuera de ambos cuerpos. El encuentro no reproduce una escena de violencia. Pide reconocer categorías y leer críticamente las funciones sociales de los relatos. Una respuesta puede revisarse si confunde ave, presagio y criatura.',
      phases:[

        {id:'fo-p2',prompt:'¿Cómo deben tratarse los relatos delicados del Trauco?',choices:[{id:'a',label:'Con contexto crítico y sin culpabilizar',response:'La mediación evita convertir violencia o sexualidad en espectáculo.'},{id:'b',label:'Como entretenimiento sin advertencia',response:'Eso reproduciría el problema detectado por la auditoría.'},{id:'c',label:'Eliminando toda explicación social',response:'La función social puede estudiarse si se contextualiza.'}]},
        {id:'fo-p3',prompt:'¿Qué aporta la Fiura?',choices:[{id:'a',label:'Un contrapunto con variantes propias',response:'No se reduce a versión femenina del Trauco.'},{id:'b',label:'Una copia exacta del guardián',response:'Atributos y representación requieren lectura diferenciada.'},{id:'c',label:'Una figura históricamente documentada',response:'Permanece en el registro de tradición pendiente.'}]}
      ],
      resolution:'El sendero vuelve a abrirse cuando criatura, ave y explicación social dejan de confundirse. El Folio del Monte conserva señales y cautelas: orientarse no significa creer una regla universal, sino reconocer qué tipo de relato se está escuchando.',folioId:'folio-forest'},
    {id:'guardian-waters',chapterId:'waters',guardianIds:['camahueto'],title:'El surco que atraviesa el mallín',epithet:'Camahueto y los ambientes de las aguas interiores',glyph:'♘',requiredFragmentIds:['waters-track','waters-corral','waters-skin'],
      opening:'El surco se ensancha y una silueta de un cuerno emerge del terreno húmedo. A cada lado permanecen el corral alterado y la superficie engañosa. El Camahueto no puede sintetizar el capítulo sin las otras dos presencias: el encuentro exige relacionar criatura, señal y ambiente, y corregir cualquier agrupación demasiado general.',
      phases:[

      ],

    chaptersComplete:CHAPTERS.every(c=>{const x=findChapterExtension(c.id);return words(`${c.opening} ${x.threshold}`)>=180&&words(`${c.explanation} ${x.tradition}`)>=350&&words(`${c.closure} ${x.closure}`)>=120&&VARIANTS.filter(v=>v.chapterId===c.id).length>=2}),
    editorialWordCounts:Object.fromEntries(CHAPTERS.map(c=>[c.id,chapterEditorialWords(c)])),
    fieldWordCounts:Object.fromEntries(CHAPTERS.map(c=>{const x=findChapterExtension(c.id);return [c.id,{opening:words(`${c.opening} ${x.threshold}`),explanation:words(`${c.explanation} ${x.tradition}`),closure:words(`${c.closure} ${x.closure}`),transition:words(c.transition)}]})),
    uniqueRenderers:[renderOriginChapter,renderSeaCourtChapter,renderCaleucheChapter,renderForestChapter,renderInlandWatersChapter,renderRectaProvinciaChapter,renderDeadRoadsChapter].length===7,
    migrationAvailable:typeof migrateV6==='function',stateValid:Boolean(normalizeState(runtime.state))
  });
  document.documentElement.dataset.v7Tests=JSON.stringify(window.__GRIMORIO_V7_TESTS__);
  console.assert(CHAPTERS.length>=7,'V7 requiere al menos siete capítulos.');
  console.assert(GUARDIAN_ENCOUNTERS.length>=7,'V7 requiere al menos siete encuentros.');
  console.assert(KNOWLEDGE_FRAGMENTS.length>=21,'V7 requiere al menos 21 fragmentos.');
  console.assert(CHARACTER_DOSSIERS.length>=24,'V7 requiere al menos 24 fichas.');
  console.assert(CURIOUS_FACTS.length>=28,'V7 requiere al menos 28 datos o elementos interesantes.');
  console.assert(window.__GRIMORIO_V7_TESTS__.factualCuriositiesSourced,'Toda curiosidad factual debe tener sourceIds.');
  console.assert(window.__GRIMORIO_V7_TESTS__.guardiansComplete,'Cada capítulo debe tener Guardián.');
  console.assert(window.__GRIMORIO_V7_TESTS__.chaptersComplete,'Cada capítulo debe tener apertura, explicación, variantes y cierre sustantivos.');
  console.assert(window.__GRIMORIO_V7_TESTS__.uniqueRenderers,'Deben existir siete renderizadores específicos.');
  </script>
