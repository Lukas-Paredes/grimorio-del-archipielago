<!-- Preferencias ANTES del primer frame: pausa de movimiento (grimorio:motion /
     reduced-motion) y velo de bruma si venimos de otra página del camino.
     Idéntico en todas las páginas del sistema nuevo. -->
<script>
(function () {
  try {
    var m = localStorage.getItem("grimorio:motion");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (m === "off" || (m === null && reduce)) {
      document.documentElement.classList.add("motion-off");
    }
    if (sessionStorage.getItem("grimorio:bruma") === "1") {
      document.documentElement.classList.add("bruma-in");
    }
  } catch (e) {}
})();
</script>

<!-- Config de la página. GENERADA por herramientas/generar_fichas.py desde
     El_Grimorio_Datos_Estructurados.txt (raw VERBATIM) + contenido/prosa/<id>.txt.
     No editar a mano: regenerar. ficha.js la lee (window.FICHA). -->
<script>
  window.FICHA = {
    raw: `@ENTIDAD
ID:: macun
NOMBRE:: El Macuñ
ALIAS:: Macuñ; chaleco de brujo
SECCION:: 09-recta-provincia
CATEGORIA:: objeto-magico
REINO:: lugar
ORIGEN:: mestizo
ALCANCE:: chilota
CONDICION:: malefico
JERARQUIA:: —
ETIMOLOGIA:: del mapudungun "makuñ" = manto
GANCHO:: Un chaleco hecho con la piel del pecho de un muerto, que alumbra como un farol y permite al brujo volar.
RESUMEN:: El chaleco mágico de piel humana, objeto más central del brujo. Da el poder de volar y alumbra con luz amarillenta. Sin él, el brujo no es nada.
DESCRIPCION:: Chaleco sin espaldar, atado a la espalda con cordones, hecho con la piel del pecho de un cadáver (de un hombre cristiano o una mujer muerta virgen), sacada del lado izquierdo y curtida con hierbas. Mientras no se usa, se enrolla como erizo; al extenderlo y ponérselo, alumbra como un farol. Su luz viene del aceite humano con que se le frota. Para volar, el brujo seguía un régimen sin sal; al estar listo (le lagrimeaba un ojo) descubría el macuñ y decía "arrehalhue" para elevarse, y "Macuñ, arréame, Diablo" para bajar. El macuñ tiene vida propia: si se olvida, vuelve solo a saltitos diciendo "cheche". Las luces misteriosas que se ven de noche en los campos del sur se atribuyen a brujos volando con su macuñ.
RELACIONES:: brujo-chilote; iniciacion; poderes-del-brujo
FUENTE:: Romo Sánchez, Diccionario de la Brujería
FUENTE:: Fritz Roa
ENLACE:: https://www.memoriachilena.gob.cl/archivos2/pdfs/MC0033461.pdf
@FIN`,
    prosa: {
      "descripcion": [
        "De todos los objetos de la brujería chilota, ninguno tan central —ni tan macabro— como el macuñ. Es un chaleco sin espaldar, que se ata a la espalda con cordones, hecho con la piel del pecho de un cadáver. Las fuentes precisan: piel de un hombre cristiano, o de una mujer muerta virgen. La piel se sacaba del lado izquierdo del cuerpo, en dirección del pecho hacia el vientre, y se curtía con ciertas hierbas.",
        "» Es un chaleco hecho de cuero de difunto, parece del pecho del ser humano. No tiene espaldar y se ata con cordones a la espalda. Mientras no se usa, el macuñ se enrolla como erizo. Y al extenderlo el brujo y ponérselo, alumbra como el mejor farol. (…) dicen que es una cosa parecida a una \"cola\", más suave que la seda, y que, si se le desdobla, grita: \"¡thac!\", salta y vuelve a enrollarse, infundiendo así profundo temor al limpio que se ha atrevido a tocarlo.\n— Romo Sánchez, «Diccionario de la Brujería en Chiloé»",
        "Su luz —esa luz amarillenta y rutilante que despide— viene, dicen, del aceite humano con que se le frota; y de ahí que «despida gotas en forma de llamas». Por eso, todavía hoy, en los campos del sur, ver una luz misteriosa flotando en la noche es cosa temida: dicen que es un brujo volando con su macuñ encendido.",
        "Para volar, el brujo debía primero seguir un régimen sin sal; estaba a punto cuando le lagrimeaba un ojo. Echaba entonces el poncho hacia atrás, descubría el macuñ y pronunciaba la palabra: «arrehalhue» —y se elevaba a gran velocidad. Para bajar, decía: «Macuñ, arréame, Diablo», y descendía suave. Y el macuñ tiene vida propia: está tan unido a su dueño que, si el brujo lo olvida en algún sitio, el chaleco regresa solo —a saltitos, diciendo «cheche»— hasta encontrarlo."
      ],
      "testimonio": [
        "» Lo segundo es una parte de la piel de los brujos que mueren i que los que quieren tenerla, la sacan en el panteon, a la izquierda del cuerpo en dirección del pecho hácia la barriga. Esa piel la curten con ciertas yerbas i en seguida los brujos se la cuelgan con unos cordones al lado izquierdo i con ella andan de noche produciendo una luz especial que los distingue. (Dice aquí que no sabe esplicar la razon de este fenómeno.)\n— Mateo Coñuecar, declaración ante el juez, Ancud, 26 de marzo de 1880",
        "» Macuñ. — Le dan luz al macuñ por medio de un depósito de aceite humano que hacen en medio de él, a semejanza de un candil, prendiéndole fuego despues.\n— Aurora Quinchem, declaración ante el juez, Ancud, 27 de marzo de 1880",
        "FUENTE:: Los brujos de Chiloé. Célebre proceso del Juzgado de Ancud (Ponce Hermanos, Santiago, 1908; Memoria Chilena MC0033459). Transcripción íntegra y aparato crítico: fuentes/proceso-ancud-1880.md."
      ],
      "lecturas": [
        "La academia registra el color de esa luz de otra manera. Evelyn Ampuero, citando al investigador Bernardo Quintana (Chiloé Mitológico, 1972), describe así el macuñ:",
        "» «luz blanquecina, suave y penetrante, producida por la magia de los \"cauquiles\" que lo impregnan».\n— Ampuero (2016), p. 70, citando a B. Quintana",
        "El ámbar con que este archivo pinta esa luz es una decisión estética del sitio, no una afirmación sobre el color del mito: la fuente académica la registra blanquecina. La variante se muestra, no se zanja.",
        "FUENTE:: Ampuero Díaz, E. L. (2016). El imaginario de los brujos y la memoria colectiva de los chilotes en el poemario Cauquil de Sergio Mansilla. Mapocho, (80), 61-91 (aquí p. 70; cita a B. Quintana, Chiloé Mitológico, 1972). Verificado contra el PDF."
      ]
    },
    cierre: "Sin él, el brujo no sería nada.",
    galeria: [],
    publicadas: ["caleuche", "pincoya", "trauco", "invunche", "cueva-quicavi", "recta-provincia", "brujo-chilote", "macun", "challanco", "voladora", "juicio-1880", "camahueto"]
  };
</script>
