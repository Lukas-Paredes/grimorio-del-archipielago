<!-- Preferencias ANTES del primer frame: pausa de movimiento (grimorio:motion /
     reduced-motion) y velo de bruma si venimos de otra página del camino.
     Idéntico en todas las páginas del sistema nuevo. -->
<script>
(function () {
  try {
    var m = localStorage.getItem("grimorio:motion");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (m === "off" || (m === null && reduce)) {
      document.documentElement.classList.add("motion-off");
    }
    if (sessionStorage.getItem("grimorio:bruma") === "1") {
      document.documentElement.classList.add("bruma-in");
    }
  } catch (e) {}
})();
</script>

<!-- Imágenes de ESTA criatura. Las url() de variables CSS las resuelve el
     navegador relativo a ficha.css (assets/css/), por eso van con "../img/...".
     El <img> del hero, en cambio, es relativo a la página: "assets/img/...". -->
<style>
  body {
    --img-descenso: image-set(url("../img/pincoya-descenso.webp") type("image/webp"), url("../img/pincoya-descenso.png") type("image/png"));
    --img-cierre: image-set(url("../img/pincoya-cierre.webp") type("image/webp"), url("../img/pincoya-cierre.png") type("image/png"));
  }
</style>

<!-- Config de la página. GENERADA por herramientas/generar_fichas.py desde
     El_Grimorio_Datos_Estructurados.txt (raw VERBATIM) + contenido/prosa/<id>.txt.
     No editar a mano: regenerar. ficha.js la lee (window.FICHA). -->
<script>
  window.FICHA = {
    raw: `@ENTIDAD
ID:: pincoya
NOMBRE:: La Pincoya
ALIAS:: Princesa de las mareas; dueña de los mariscos
SECCION:: 02-corte-del-mar
CATEGORIA:: espiritu-marino
REINO:: mar
ORIGEN:: prehispanico
ALCANCE:: chilota
CONDICION:: benefico
JERARQUIA:: Princesa (hija del Millalobo y la Huenchula)
GANCHO:: Sale del agua al amanecer, de cabellos dorados y vestida de algas, y baila en la arena. Es lo más cercano a la bondad que tiene el océano de Chiloé.
RESUMEN:: Princesa del mar, dueña de los mariscos. Su danza en la playa presagia la abundancia o la escasez de la pesca.
DESCRIPCION:: Mujer joven y hermosa, de tez clara y largos cabellos rubios, vestida de algas. Hija del Millalobo y la Huenchula. Protege el mar, lo siembra de vida y rescata náufragos. Es la dueña de los mariscos (su hermana la Sirena lo es de los peces). Su danza es su signo: si baila mirando al mar, habrá abundancia; si baila de espaldas al mar, vendrá la escasez.
VARIANTE:: La laguna Huelde | Otra versión la hace nacer en la laguna Huelde, cerca de Cucao; con un silbido hacía emerger un tronco de oro para peinarse. Raptada para llevar prosperidad a playas lejanas, desde entonces las aguas de Chiloé se oscurecieron.
VARIANTE:: Castigo a la codicia | Si se marisca o pesca de más en un lugar, la Pincoya se enoja, lo abandona y queda estéril.
VARIANTE:: Cómo atraerla | Le gustan la alegría y la fiesta; los chilotes cantan, bailan y hacen curantos para que los favorezca.
INTERPRETACION:: Imagen de la reciprocidad entre el hombre y el mar y de la pesca sostenible. Fusión de la diosa marina indígena con la bondad cristiana. Es la criatura más querida del archipiélago.
RELACIONES:: millalobo; huenchula; pincoy; sirena-chilota; caleuche
FUENTE:: Cavada (1914)
FUENTE:: Núñez (2022), Servicio Nacional del Patrimonio Cultural
ENLACE:: https://www.marcachile.cl/en/mitos-y-leyendas-chilenas/
@FIN`,
    prosa: {
      "descripcion": [
        "La Pincoya es una mujer joven y hermosa, de tez blanca ligeramente bronceada y largos cabellos rubios, vestida de algas del mar. Es hija del Millalobo y la Huenchula, una de las princesas de las aguas. Su labor es proteger el mar, sembrarlo de vida y rescatar a los náufragos. Es la dueña de los mariscos —como su hermana la Sirena lo es de los peces. Así lo resumió una mujer de la isla Caylin, y la frase quedó:",
        "» «La Pincoya es la dueña de los mariscos, y la sirena es la dueña de los pescados.»\n— Rosa Chiguay, Isla Caylin, en Núñez (2022)",
        "Su danza es su signo. Baila en las playas, con los brazos abiertos, y la dirección de su baile anuncia lo que vendrá:",
        "| Si danza mirando hacia el mar → habrá abundancia\n| Si danza de espaldas al mar → vendrá la escasez",
        "Por eso, si un pescador tiene gran éxito en su faena, es porque la Pincoya danzó la noche anterior mirando al océano."
      ],
      "interpretacion": "La Pincoya es la imagen viva de la reciprocidad entre el hombre y el mar: su danza le recuerda a las comunidades costeras que el equilibrio es frágil, y que el mar da a quien lo respeta y niega a quien lo saquea. En su figura se fundieron, con los siglos, la diosa marina indígena y la bondad cristiana. Es, quizás, la criatura más querida de todo el archipiélago."
    },
    cierre: "Y bajo la marea, los bancos de mariscos aguardan la próxima danza.",
    publicadas: ["caleuche", "pincoya", "trauco", "invunche", "cueva-quicavi", "camahueto"]
  };
</script>

<body data-entity="pincoya">

<!-- Fondo abisal fijo con parallax + overlay de legibilidad -->

  <div class="abyss__veil"></div>
</div>

<main id="ficha">

    <div class="hero__edges" aria-hidden="true"></div>

      <span class="fog__layer fog__layer--3" data-parallax="-0.17"></span>
    </div>

    <div class="hero__portal" aria-hidden="true"><span></span></div>

    </div>

  <!-- ════════ DESCENSO · cuerpo de la ficha ════════ -->
  <div class="scroll" id="descenso">

    <!-- Fondo del descenso: el mundo de la criatura una sola vez arriba, fundido al negro -->
    <div class="descenso-bg" aria-hidden="true" data-parallax="0.16" data-rel="descenso"></div>

    <!-- Gancho: epígrafe atmosférico -->
    <section class="movement movement--gancho reveal" id="sec-gancho">
      <p class="gancho" id="gancho"></p>
    </section>

    <!-- Placa de datos de bestiario -->
    <section class="movement reveal" id="sec-datos" aria-labelledby="h-datos">
      <div class="rule"><h2 id="h-datos">Datos de bestiario</h2></div>
      <div class="frame frame--plaque">
        <div class="frame__panel">
          <dl class="datos" id="datos"></dl>
        </div>
      </div>
    </section>

    <!-- Resumen + descripción -->
    <section class="movement reveal lectura" id="sec-relato" aria-labelledby="h-relato">
      <div class="rule"><h2 id="h-relato">El relato</h2></div>
      <blockquote class="resumen" id="resumen"></blockquote>
      <div class="descripcion" id="descripcion"></div>
    </section>

    <!-- Variantes: cajones de archivo -->
    <section class="movement reveal" id="sec-variantes" aria-labelledby="h-var">
      <div class="rule"><h2 id="h-var">Variantes del relato</h2></div>
      <div class="cajones" id="variantes"></div>
    </section>

    <!-- Defensa: cómo enfrentarlo (solo si la entidad lo trae) -->
    <section class="movement reveal" id="sec-defensa" aria-labelledby="h-defensa" hidden>
      <div class="rule"><h2 id="h-defensa">Defensa</h2></div>
      <div class="frame frame--plaque">
        <div class="frame__panel">
          <p class="defensa" id="defensa"></p>
        </div>
      </div>
    </section>

    <!-- Interpretación: nota del archivero -->
    <section class="movement reveal" id="sec-interp">
      <aside class="nota">
        <span class="nota__pin" aria-hidden="true"></span>
        <span class="nota__label">Nota del archivero</span>
        <p class="nota__text" id="interpretacion"></p>
      </aside>
    </section>

    <!-- De dónde nació el mito: prosa del grimorio (oculta si la criatura no la trae) -->
    <section class="movement reveal lectura" id="sec-origen" aria-labelledby="h-origen" hidden>
      <div class="rule"><h2 id="h-origen">De dónde nació el mito</h2></div>
      <div class="prosa" id="origen-mito"></div>
    </section>

    <!-- Desarrollo documental (solo si la entidad lo trae) -->
    <section class="movement reveal" id="sec-desarrollo" hidden>
      <p class="desarrollo" id="desarrollo"></p>
    </section>

    <!-- Vitrina: otras piezas del archipiélago -->
    <section class="movement reveal" id="sec-vitrina" aria-labelledby="h-vitrina">
      <div class="rule"><h2 id="h-vitrina">Otras piezas del archipiélago</h2></div>
      <div class="vitrina" id="vitrina"></div>
    </section>

    <!-- Fuentes y enlaces -->
    <footer class="movement reveal pie" id="pie"></footer>
  </div>

  <!-- ════════ CIERRE · el corazón del mundo (fin del viaje) ════════ -->
  <section class="cierre" id="cierre" aria-label="Cierre">
    <div class="cierre__bg" aria-hidden="true"></div>
    <div class="cierre__edges" aria-hidden="true"></div>

    <p class="sello">El Grimorio del Archipiélago</p>
  </section>
