<!-- Preferencias ANTES del primer frame: pausa de movimiento (grimorio:motion /
     reduced-motion) y velo de bruma si venimos de otra página del camino.
     Idéntico en todas las páginas del sistema nuevo. -->
<script>
(function () {
  try {
    var m = localStorage.getItem("grimorio:motion");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (m === "off" || (m === null && reduce)) {
      document.documentElement.classList.add("motion-off");
    }
    if (sessionStorage.getItem("grimorio:bruma") === "1") {
      document.documentElement.classList.add("bruma-in");
    }
  } catch (e) {}
})();
</script>

<!-- Imágenes de ESTA criatura. Las url() de variables CSS las resuelve el
     navegador relativo a ficha.css (assets/css/), por eso van con "../img/...".
     El <img> del hero, en cambio, es relativo a la página: "assets/img/...". -->

</style>

<!-- Config de la página. GENERADA por herramientas/generar_fichas.py desde
     El_Grimorio_Datos_Estructurados.txt (raw VERBATIM) + contenido/prosa/<id>.txt.
     No editar a mano: regenerar. ficha.js la lee (window.FICHA). -->
<script>
  window.FICHA = {
    raw: `@ENTIDAD
ID:: trauco
NOMBRE:: El Trauco
ALIAS:: Thrauco; Chauco; Trauko
SECCION:: 04-bosque
CATEGORIA:: antropomorfo-bosque
REINO:: bosque
ORIGEN:: prehispanico
ALCANCE:: chilota
CONDICION:: malefico
JERARQUIA:: —
ETIMOLOGIA:: del mapudungun "trawko"
GANCHO:: No es alto ni hermoso, apenas te llega a la cintura, con un hacha de piedra. Pero ninguna mujer que cruza su mirada vuelve igual.
RESUMEN:: Hombrecillo deforme del bosque que seduce a las mujeres en sueños (explicando embarazos) y tulle a los hombres con su aliento.
DESCRIPCION:: Hombre pequeño y deforme, de 60 a 90 cm. Habita huecos de árboles y cavernas, come frutos del bosque y tiene fuerza descomunal. Carga un hacha de piedra con la que golpea los troncos. Seduce con la mirada a las mujeres jóvenes y las posee en sueños; ellas despiertan sin recordar y, nueve meses después, nace un hijo. A los hombres les causa torceduras y tullimiento con la mirada o el aliento. Viste traje de quilineja y sombrero cónico; sus pies no tienen talón ni dedos; usa un bastón retorcido llamado pahueldún.
VARIANTE:: Aire de trauco | Existe una dolencia llamada "aire de trauco/trauca": el Trauco contamina los espacios sombríos del bosque.
INTERPRETACION:: Explicación antigua para los embarazos fuera del matrimonio, protegiendo a las madres solteras del juicio social. Emparentado con el fauno y el sátiro.
RELACIONES:: fiura; ruende; condena
FUENTE:: Cavada (1914)
FUENTE:: Núñez (2022), Servicio Nacional del Patrimonio Cultural
ENLACE:: https://www.cdbp.gob.cl/noticias/chiloe-hogar-de-criaturas-mitologicas-fascinantes
@FIN`,
    prosa: {
      "descripcion": [
        "El Trauco es un hombre pequeño y deforme, de entre sesenta y noventa centímetros según quien lo cuente. Habita los huecos de los árboles y las cavernas del bosque, y se alimenta de sus frutos. Pese a su tamaño, posee una fuerza descomunal. Carga siempre un hacha de piedra, y con ella golpea los troncos para anunciar que ha llegado.",
        "Su poder es doble. Sobre las mujeres jóvenes ejerce un hechizo: las seduce con la mirada y las posee en sueños; ellas despiertan confundidas, sin recordar con claridad lo ocurrido —hasta que, nueve meses después, nace un hijo. Sobre los hombres descarga su maleficio: con la mirada o con el poder nefasto de su aliento les causa torceduras de cuello, tullimiento y deformidades semejantes a las suyas.",
        "Viste un traje tejido de quilineja y un sombrero cónico de fibras silvestres. Sus piernas terminan en un remedo de pie, sin talón y sin dedos, por lo que no camina bien; se ayuda de un bastón retorcido —tan retorcido como él— llamado pahueldún, con el cual se le reconoce."
      ],
      "interpretacion": "Hay quienes ven en el Trauco una explicación antigua para los embarazos fuera del matrimonio, en tiempos en que quedar encinta sin esposo era deshonra: el hombrecillo del bosque cargaba la culpa, y la madre soltera quedaba a salvo del juicio del pueblo. Otros lo emparentan con el fauno de los romanos y el sátiro de los griegos —seres de instinto, habitantes de los bosques solitarios, dominados por la lujuria."
    },
    cierre: "Y en lo más hondo del bosque, donde el hacha golpea sin leñador, algo todavía espera.",
    publicadas: ["caleuche", "pincoya", "trauco", "invunche", "camahueto"]
  };
</script>
</head>
