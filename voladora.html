<!-- Preferencias ANTES del primer frame: pausa de movimiento (grimorio:motion /
     reduced-motion) y velo de bruma si venimos de otra página del camino.
     Idéntico en todas las páginas del sistema nuevo. -->
<script>
(function () {
  try {
    var m = localStorage.getItem("grimorio:motion");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (m === "off" || (m === null && reduce)) {
      document.documentElement.classList.add("motion-off");
    }
    if (sessionStorage.getItem("grimorio:bruma") === "1") {
      document.documentElement.classList.add("bruma-in");
    }
  } catch (e) {}
})();
</script>

<!-- Imágenes de ESTA criatura. Las url() de variables CSS las resuelve el
     navegador relativo a ficha.css (assets/css/), por eso van con "../img/...".
     El <img> del hero, en cambio, es relativo a la página: "assets/img/...". -->
<style>
  body {
    --img-fondo: none;                                  /* sin imagen de mar; solo penumbra */
    --img-descenso: none;                               /* sin naufragio; degradado abisal neutro */
    --img-cierre: none;                                 /* sin lecho marino; degradado abisal neutro */
  }
</style>

<!-- Config de la página. GENERADA por herramientas/generar_fichas.py desde
     El_Grimorio_Datos_Estructurados.txt (raw VERBATIM) + contenido/prosa/<id>.txt.
     No editar a mano: regenerar. ficha.js la lee (window.FICHA). -->
<script>
  window.FICHA = {
    raw: `@ENTIDAD
ID:: voladora
NOMBRE:: La Voladora
ALIAS:: —
SECCION:: 09-recta-provincia
CATEGORIA:: ave-bruja
REINO:: aire
ORIGEN:: mestizo
ALCANCE:: chilota
CONDICION:: malefico
JERARQUIA:: Mensajera de la cofradía
GANCHO:: Para poder volar, vomita sus propias entrañas y las deja en una fuente. Convertida en pájaro, sale a llevar los mensajes de los brujos.
RESUMEN:: Mujer al servicio de los brujos que actúa como mensajera; vomita sus vísceras para aligerarse y volar de noche convertida en pájaro.
DESCRIPCION:: Mujer al servicio de los brujos, el correo de la cofradía. Aunque tiene poderes, ocupa un lugar subordinado (muchos secretos le están vetados). Para volar, al caer la noche vomita sus intestinos y los deja escondidos en una fuente o paila entre los matorrales, aligerando su cuerpo; convertida en pájaro, cumple los encargos, y al amanecer regresa, se traga las entrañas y recobra su forma.
VARIANTE:: Su punto débil | Si alguien halla los intestinos y los sala —o solo los mueve— la Voladora no puede recomponerse y muere al amanecer.
INTERPRETACION:: Pariente del Chonchón: ambos son formas del vuelo brujo. El Chonchón se lleva la cabeza; la Voladora deja las vísceras.
RELACIONES:: chonchon; brujo-chilote; recta-provincia
FUENTE:: Cavada (1914)
ENLACE:: https://www.guioteca.com/cultura-chilena/mitologia-de-chiloe-guia-para-conocer-y-entender-a-sus-extranas-y-temibles-criaturas/
@FIN`,
    prosa: {
      "descripcion": [
        "La Voladora es una mujer al servicio de los brujos, que actúa como su mensajera —el correo de la cofradía. Aunque tiene poderes, ocupa un lugar subordinado: muchos secretos y prácticas de los brujos le están vetados. Su oficio es llevar y traer los recados de la noche.",
        "Para volar, al caer la noche, vomita sus intestinos y los deja escondidos en una fuente o paila —bien oculta entre los matorrales— aligerando así su cuerpo. Convertida en pájaro, sale a cumplir los encargos. Y al amanecer regresa, vuelve a tragarse las entrañas y recobra su forma humana."
      ],
      "lecturas": [
        "La academia registra el mismo rito con las mismas palabras del miedo. Ampuero, en su estudio del imaginario brujeril en la poesía de Sergio Mansilla, lo recoge así:",
        "» antes de emprender [su] vuelo debe «alivianarse», esto es, dejar sus tripas en un recipiente, pero si estas son descubiertas o dañadas, la Voladora muere.\n— Ampuero (2016), p. 79",
        "Y suma la distinción que la separa de los brujos: «a diferencia de los brujos, que utilizan el makuñ o corpiño mágico para volar, ellas lo hacen en forma de aves» (Ampuero, citando a Montecino).",
        "FUENTE:: Ampuero Díaz, E. L. (2016). El imaginario de los brujos y la memoria colectiva de los chilotes en el poemario Cauquil de Sergio Mansilla. Mapocho, (80), 61-91 (aquí p. 79). Verificado contra el PDF."
      ]
    },
    cierre: "Pero ay de ella si alguien encuentra esas vísceras —y las sala.",
    galeria: [],
    publicadas: ["caleuche", "pincoya", "trauco", "invunche", "cueva-quicavi", "recta-provincia", "brujo-chilote", "macun", "challanco", "voladora", "juicio-1880", "camahueto"]
  };
</script>
</head>

<body data-entity="voladora">

<!-- Fondo abisal fijo con parallax + overlay de legibilidad -->
<div class="abyss" aria-hidden="true">
  <div class="abyss__sea" data-parallax="0.06"></div>
  <div class="abyss__veil"></div>
</div>

<main id="ficha">

  <!-- ════════ HERO · portal de entrada ════════ -->
  <header class="hero hero--lamina" aria-labelledby="hero-name">
    <div class="hero__art" data-parallax="0.12">
      <picture>
        <source srcset="assets/img/voladora-lamina.webp" type="image/webp">
        <img src="assets/img/voladora-lamina.png" alt="Mujer al servicio de los brujos que actúa como mensajera; vomita sus vísceras para aligerarse y volar de noche convertida en pájaro." onerror="this.classList.add('is-missing')">
      </picture>
    </div>
    <div class="hero__lantern" aria-hidden="true"></div>
    <div class="hero__edges" aria-hidden="true"></div>

    <div class="fog hero__fog" aria-hidden="true">
      <span class="fog__layer fog__layer--1" data-parallax="-0.06"></span>
      <span class="fog__layer fog__layer--2" data-parallax="-0.11"></span>
      <span class="fog__layer fog__layer--3" data-parallax="-0.17"></span>
    </div>

    <div class="hero__portal" aria-hidden="true"><span></span></div>

    <div class="hero__copy">
      <p class="hero__eyebrow" id="hero-cat">Bestiario</p>
      <h1 class="hero__name" id="hero-name">·</h1>
      <p class="hero__alias" id="hero-alias"></p>
    </div>

    <a class="hero__cue" href="#descenso" aria-label="Descender a la ficha">
      <span>desciende</span>
      <span class="hero__chev" aria-hidden="true"><img class="hero__plomada" src="assets/img/indicador-plomada.png" alt="" width="19" height="48" decoding="async"></span>
    </a>
  </header>

  <!-- ════════ DESCENSO · cuerpo de la ficha ════════ -->
  <div class="scroll" id="descenso">

    <!-- Fondo del descenso: el mundo de la criatura una sola vez arriba, fundido al negro -->
    <div class="descenso-bg" aria-hidden="true" data-parallax="0.16" data-rel="descenso"></div>

    <!-- Gancho: epígrafe atmosférico -->
    <section class="movement movement--gancho reveal" id="sec-gancho">
      <p class="gancho" id="gancho"></p>
    </section>

    <!-- Placa de datos de bestiario -->
    <section class="movement reveal" id="sec-datos" aria-labelledby="h-datos">
      <div class="rule"><h2 id="h-datos">Datos de bestiario</h2></div>
      <div class="frame frame--plaque">
        <div class="frame__panel">
          <dl class="datos" id="datos"></dl>
        </div>
      </div>
    </section>

    <!-- Resumen + descripción -->
    <section class="movement reveal lectura" id="sec-relato" aria-labelledby="h-relato">
      <div class="rule"><h2 id="h-relato">El relato</h2></div>
      <blockquote class="resumen" id="resumen"></blockquote>
      <div class="descripcion" id="descripcion"></div>
    </section>

    <!-- Variantes: cajones de archivo -->
    <section class="movement reveal" id="sec-variantes" aria-labelledby="h-var">
      <div class="rule"><h2 id="h-var">Variantes del relato</h2></div>
      <div class="cajones" id="variantes"></div>
    </section>

    <!-- Vitrina del capítulo: piezas del corpus sin parada propia, embebidas
         VERBATIM (solo si la página trae window.FICHA.galeria) -->
    <section class="movement reveal" id="sec-vitrina-cap" aria-labelledby="h-vitrina-cap" hidden>
      <div class="rule"><h2 id="h-vitrina-cap">Vitrina del capítulo</h2></div>
      <div class="galeria" id="galeria"></div>
    </section>

    <!-- Defensa: cómo enfrentarlo (solo si la entidad lo trae) -->
    <section class="movement reveal" id="sec-defensa" aria-labelledby="h-defensa" hidden>
      <div class="rule"><h2 id="h-defensa">Defensa</h2></div>
      <div class="frame frame--plaque">
        <div class="frame__panel">
          <p class="defensa" id="defensa"></p>
        </div>
      </div>
    </section>

    <!-- Interpretación: nota del archivero -->
    <section class="movement reveal" id="sec-interp">
      <aside class="nota">
        <span class="nota__pin" aria-hidden="true"></span>
        <span class="nota__label">Nota del archivero</span>
        <p class="nota__text" id="interpretacion"></p>
      </aside>
    </section>

    <!-- De dónde nació el mito: prosa del grimorio (oculta si la criatura no la trae) -->
    <section class="movement reveal lectura" id="sec-origen" aria-labelledby="h-origen" hidden>
      <div class="rule"><h2 id="h-origen">De dónde nació el mito</h2></div>
      <div class="prosa" id="origen-mito"></div>
    </section>

    <!-- Lecturas: qué dice la academia (solo si la prosa trae @LECTURAS).
         Placa sobria diferenciada; contenido verificado contra fuentes/_raw/lecturas/. -->
    <section class="movement reveal" id="sec-lecturas" aria-labelledby="h-lecturas" hidden>
      <div class="rule"><h2 id="h-lecturas">Lecturas</h2></div>
      <div class="lecturas" id="lecturas">
        <p class="lecturas__intro">Qué dice la investigación académica sobre esta pieza.</p>
      </div>
    </section>

    <!-- Desarrollo documental (solo si la entidad lo trae) -->
    <section class="movement reveal" id="sec-desarrollo" hidden>
      <p class="desarrollo" id="desarrollo"></p>
    </section>

    <!-- Vitrina: otras piezas del archipiélago -->
    <section class="movement reveal" id="sec-vitrina" aria-labelledby="h-vitrina">
      <div class="rule"><h2 id="h-vitrina">Otras piezas del archipiélago</h2></div>
      <div class="vitrina" id="vitrina"></div>
    </section>

    <!-- Fuentes y enlaces -->
    <footer class="movement reveal pie" id="pie"></footer>
  </div>

  <!-- ════════ CIERRE · el corazón del mundo (fin del viaje) ════════ -->
  <section class="cierre" id="cierre" aria-label="Cierre">
    <div class="cierre__bg" aria-hidden="true"></div>
    <div class="cierre__edges" aria-hidden="true"></div>
    <div class="cierre__glow" aria-hidden="true"></div>
    <div class="fog cierre__fog" aria-hidden="true">
      <span class="fog__layer fog__layer--2"></span>
      <span class="fog__layer fog__layer--3"></span>
    </div>
    <p class="cierre__phrase reveal"></p>
    <p class="sello">El Grimorio del Archipiélago</p>
  </section>
</main>
