<!-- Preferencias ANTES del primer frame: pausa de movimiento (grimorio:motion /
     reduced-motion) y velo de bruma si venimos de otra página del camino.
     Idéntico en todas las páginas del sistema nuevo. -->
<script>
(function () {
  try {
    var m = localStorage.getItem("grimorio:motion");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (m === "off" || (m === null && reduce)) {
      document.documentElement.classList.add("motion-off");
    }
    if (sessionStorage.getItem("grimorio:bruma") === "1") {
      document.documentElement.classList.add("bruma-in");
    }
  } catch (e) {}
})();
</script>

<!-- Config de la página. GENERADA por herramientas/generar_fichas.py desde
     El_Grimorio_Datos_Estructurados.txt (raw VERBATIM) + contenido/prosa/<id>.txt.
     No editar a mano: regenerar. ficha.js la lee (window.FICHA). -->
<script>
  window.FICHA = {
    raw: `@ENTIDAD
ID:: recta-provincia
NOMBRE:: La Recta Provincia
ALIAS:: La Mayoría; El Tribunal de la Raza Indígena
SECCION:: 09-recta-provincia
CATEGORIA:: relato
REINO:: lugar
ORIGEN:: mestizo
ALCANCE:: chilota
CONDICION:: ambiguo
JERARQUIA:: Gobierno secreto del archipiélago
GANCHO:: Un Estado dentro del Estado. Un gobierno en la sombra, con rey, leyes, tribunales y territorio propios, que durante un siglo gobernó Chiloé.
RESUMEN:: Sociedad secreta de brujos (s.XVIII-XIX) con estructura jerárquica, justicia y territorio propios, que operó como poder paralelo al Estado chileno.
DESCRIPCION:: No era un grupo de brujos sueltos, sino una organización con estructura, jerarquía, leyes, tribunales y territorio: un Estado dentro del Estado, comparable a un partido político en clandestinidad. Los brujos llamaban "Recta Provincia" a la Provincia de Chiloé entera, como si fuera de ellos. Su consejo gobernante era "La Mayoría"; por su función de impartir justicia se la llamó "Tribunal de la Raza Indígena". Impartía justicia, cobraba por sus servicios y castigaba; en muchas localidades su autoridad pesó tanto o más que la del Estado.
INTERPRETACION:: Su existencia expresa la resistencia de la cultura insular al Estado central que llegó tras la incorporación de Chiloé a Chile en 1826. Es el corazón histórico-mítico de la brujería chilota.
RELACIONES:: brujo-chilote; la-mayoria; siete-republicas; cueva-quicavi; juicio-1880; libro-de-moraleda
FUENTE:: Gonzalo Rojas Flores, Reyes sobre la tierra
FUENTE:: Sergio Fritz Roa, La Recta Provincia
ENLACE:: https://es.wikipedia.org/wiki/Recta_Provincia
ENLACE:: https://viajaachiloe.com/la-recta-provincia-el-enigmatico-gobierno-secreto-de-los-brujos-de-chiloe/
@FIN`,
    prosa: {
      "descripcion": [
        "La Recta Provincia no era un grupo de brujos sueltos haciendo maldades. Era algo mucho más inquietante: una organización, con estructura, jerarquía, leyes, tribunales y territorio. Un Estado dentro del Estado. Un gobierno en la sombra.",
        "Se la conoció por varios nombres. «La Recta Provincia» —así llamaban los brujos a la Provincia de Chiloé entera, como si fuera de ellos. «La Mayoría» —el consejo que la gobernaba. Y «el Tribunal de la Raza Indígena» —por su función de impartir justicia.",
        "Al frente estaba un Rey (a veces se habla de reyes y presidentes). Bajo él, un consejo gobernante: la Mayoría. Y un enjambre de cargos y funcionarios, con nombres que imitaban a los de un gobierno real: virreyes, escribanos, alcaldes, secretarios, reparadores, investigadores; y luego los brujos comunes, los curanderos, las machis, y los guardianes —los porteros de la cueva. El jefe supremo en Quicaví recibía también el nombre de «el Supremo» o «el Buta».",
        "Quien necesitaba algo —una venganza, una curación, hallar a un ladrón— acudía al presidente de su distrito, que elevaba la petición a la Mayoría. Y la Mayoría dictaminaba. Como casi siempre se desconocía al culpable de un robo o un mal, los brujos recurrían al challanco para identificarlo. Los servicios se pagaban —y con ese dinero, dicen, se pagaban hasta los «servicios postales» de la cofradía y los contratos con la tripulación del Caleuche. Se les temía y se les respetaba por igual: daban protección y castigo, curación y muerte, según la petición."
      ],
      "testimonio": [
        "» Segun la sentencia de 2 de Marzo de 1881, del juez Beytía, en el juicio de brujos se ha seguido esta causa por el delito de asociación ilícita contra los comprometidos en la sociedad de los brujos, que estos llaman Recta Provincia. De las declaraciones i de la lectura de los papeles encontrados resulta que esa institucion existe desde tiempos remotos i cuenta con un número excesivo de afiliados, todos los que a su incorporación se les confiere un empleo u ocupacion que aceptan bajo la obligacion de sijilo i obediencia.\n— Sentencia del juez Beytía, Ancud, 2 de marzo de 1881",
        "» Por los nombres de los lugares para que han sido nombrados se sabe que han hecho una sub-división territorial bajo nombres i linderos que ellos conocen.\n— Sentencia del juez Beytía, 2 de marzo de 1881",
        "» Este cuerpo de empleados tan numeroso como el de sus afiliados, lo forman un Rei i Reina, (jefes Supremos), Presidentes i Vice, Intendentes, Secretarios, Comandantes, Reparadores i Médicos.\n— Sentencia del juez Beytía, 2 de marzo de 1881",
        "FUENTE:: Los brujos de Chiloé. Célebre proceso del Juzgado de Ancud (Ponce Hermanos, Santiago, 1908; Memoria Chilena MC0033459). Transcripción íntegra y aparato crítico: fuentes/proceso-ancud-1880.md."
      ]
    },
    cierre: "Pasó de verdad —o al menos, de verdad fue creída.",
    publicadas: ["caleuche", "pincoya", "trauco", "invunche", "cueva-quicavi", "recta-provincia", "brujo-chilote", "macun", "challanco", "voladora", "camahueto"]
  };
</script>
