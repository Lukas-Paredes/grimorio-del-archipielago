ID:: recta-provincia
NOMBRE:: La Recta Provincia
ALIAS:: La Mayoría; El Tribunal de la Raza Indígena
SECCION:: 09-recta-provincia
CATEGORIA:: relato
REINO:: lugar
ORIGEN:: mestizo
ALCANCE:: chilota
CONDICION:: ambiguo
JERARQUIA:: Gobierno secreto del archipiélago
GANCHO:: Un Estado dentro del Estado. Un gobierno en la sombra, con rey, leyes, tribunales y territorio propios, que durante un siglo gobernó Chiloé.
RESUMEN:: Sociedad secreta de brujos (s.XVIII-XIX) con estructura jerárquica, justicia y territorio propios, que operó como poder paralelo al Estado chileno.
DESCRIPCION:: No era un grupo de brujos sueltos, sino una organización con estructura, jerarquía, leyes, tribunales y territorio: un Estado dentro del Estado, comparable a un partido político en clandestinidad. Los brujos llamaban "Recta Provincia" a la Provincia de Chiloé entera, como si fuera de ellos. Su consejo gobernante era "La Mayoría"; por su función de impartir justicia se la llamó "Tribunal de la Raza Indígena". Impartía justicia, cobraba por sus servicios y castigaba; en muchas localidades su autoridad pesó tanto o más que la del Estado.
INTERPRETACION:: Su existencia expresa la resistencia de la cultura insular al Estado central que llegó tras la incorporación de Chiloé a Chile en 1826. Es el corazón histórico-mítico de la brujería chilota.
RELACIONES:: brujo-chilote; la-mayoria; siete-republicas; cueva-quicavi; juicio-1880; libro-de-moraleda
FUENTE:: Gonzalo Rojas Flores, Reyes sobre la tierra
FUENTE:: Sergio Fritz Roa, La Recta Provincia
ENLACE:: https://es.wikipedia.org/wiki/Recta_Provincia
ENLACE:: https://viajaachiloe.com/la-recta-provincia-el-enigmatico-gobierno-secreto-de-los-brujos-de-chiloe/
@FIN`,
    prosa: {
      "descripcion": [
        "La Recta Provincia no era un grupo de brujos sueltos haciendo maldades. Era algo mucho más inquietante: una organización, con estructura, jerarquía, leyes, tribunales y territorio. Un Estado dentro del Estado. Un gobierno en la sombra.",
        "Se la conoció por varios nombres. «La Recta Provincia» —así llamaban los brujos a la Provincia de Chiloé entera, como si fuera de ellos. «La Mayoría» —el consejo que la gobernaba. Y «el Tribunal de la Raza Indígena» —por su función de impartir justicia.",
        "Al frente estaba un Rey (a veces se habla de reyes y presidentes). Bajo él, un consejo gobernante: la Mayoría. Y un enjambre de cargos y funcionarios, con nombres que imitaban a los de un gobierno real: virreyes, escribanos, alcaldes, secretarios, reparadores, investigadores; y luego los brujos comunes, los curanderos, las machis, y los guardianes —los porteros de la cueva. El jefe supremo en Quicaví recibía también el nombre de «el Supremo» o «el Buta».",
        "Quien necesitaba algo —una venganza, una curación, hallar a un ladrón— acudía al presidente de su distrito, que elevaba la petición a la Mayoría. Y la Mayoría dictaminaba. Como casi siempre se desconocía al culpable de un robo o un mal, los brujos recurrían al challanco para identificarlo. Los servicios se pagaban —y con ese dinero, dicen, se pagaban hasta los «servicios postales» de la cofradía y los contratos con la tripulación del Caleuche. Se les temía y se les respetaba por igual: daban protección y castigo, curación y muerte, según la petición."
      ],
      "testimonio": [
        "» Segun la sentencia de 2 de Marzo de 1881, del juez Beytía, en el juicio de brujos se ha seguido esta causa por el delito de asociación ilícita contra los comprometidos en la sociedad de los brujos, que estos llaman Recta Provincia. De las declaraciones i de la lectura de los papeles encontrados resulta que esa institucion existe desde tiempos remotos i cuenta con un número excesivo de afiliados, todos los que a su incorporación se les confiere un empleo u ocupacion que aceptan bajo la obligacion de sijilo i obediencia.\n— Sentencia del juez Beytía, Ancud, 2 de marzo de 1881",
        "» Por los nombres de los lugares para que han sido nombrados se sabe que han hecho una sub-división territorial bajo nombres i linderos que ellos conocen.\n— Sentencia del juez Beytía, 2 de marzo de 1881",
        "» Este cuerpo de empleados tan numeroso como el de sus afiliados, lo forman un Rei i Reina, (jefes Supremos), Presidentes i Vice, Intendentes, Secretarios, Comandantes, Reparadores i Médicos.\n— Sentencia del juez Beytía, 2 de marzo de 1881",
        "FUENTE:: Los brujos de Chiloé. Célebre proceso del Juzgado de Ancud (Ponce Hermanos, Santiago, 1908; Memoria Chilena MC0033459). Transcripción íntegra y aparato crítico: fuentes/proceso-ancud-1880.md."
      ],
      "lecturas": [
        "El sociólogo Fernando Valenzuela lee el Tribunal de la Raza Indígena como una institución performativa: los discursos recogidos en las actas del proceso de 1880 no solo describían la asociación — la hacían real. En su lectura, ese mundo estaba gobernado por la reciprocidad: su quiebre se manifestaba como enfermedad en los cuerpos, y la magia y la adivinación compensaban, por medio de la venganza, las expectativas rotas.",
        "» Discursos dieron forma e hicieron real la asociación de brujos Tribunal de la Raza Indígena, también llamada Recta Provincia, en Chiloé a fines del siglo diecinueve.\n— Valenzuela (2014), p. 35",
        "El antropólogo David Núñez aporta el sustrato indígena: bajo la figura del «brujo» está el kalku del mapuche kimün — y la traducción misma ya es una distorsión colonial.",
        "» Kalku se suele traducir como hechicero o brujo, conceptos equívocos toda vez que remiten a la idea cristiana de una persona que está aliada con el demonio, figura que no existe originalmente en el mapuche kimün.\n— Núñez (2022), p. 24",
        "Y Evelyn Ampuero recoge el origen como resistencia: la cofradía, que al parecer ya tenía un siglo en 1880,",
        "» surgió como resistencia organizada contra sus amos: el encomendero español y todo el sistema que lo respaldaba.\n— Ampuero (2016), p. 65",
        "FUENTE:: Valenzuela, F. A. (2014). La enfermedad de todos en el cuerpo propio. Universum, 29(1), 35-55 (aquí p. 35; machi/kalku en pp. 38-39) · Núñez, D. (2022). El sustrato indígena de los seres mitológicos de Chiloé. Bajo la Lupa, SNPC (aquí pp. 4 y 24) · Ampuero (2016). Mapocho, (80) (aquí p. 65). Todas verificadas contra los PDF/txt de fuentes/_raw/lecturas/."
      ]
    },
    cierre: "Pasó de verdad —o al menos, de verdad fue creída.",
    galeria: [{"raw": "@ENTIDAD\nID:: la-mayoria\nNOMBRE:: La Mayoría\nALIAS:: El consejo de la Recta Provincia\nSECCION:: 09-recta-provincia\nCATEGORIA:: relato\nREINO:: lugar\nORIGEN:: mestizo\nALCANCE:: chilota\nCONDICION:: ambiguo\nJERARQUIA:: Consejo gobernante de la Recta Provincia\nGANCHO:: Al frente, un Rey. Bajo él, un consejo y un enjambre de cargos que imitaban a los de un gobierno real: virreyes, escribanos, alcaldes.\nRESUMEN:: El consejo de gobierno de la Recta Provincia, con un Rey a la cabeza y cargos jerárquicos que remedaban un Estado.\nDESCRIPCION:: La cúpula de la Recta Provincia. Al frente, un Rey (a veces se habla de reyes y presidentes). Bajo él, el consejo gobernante (la Mayoría) y un enjambre de funcionarios con nombres de gobierno real: virreyes, escribanos, alcaldes, secretarios, reparadores, investigadores; luego los brujos comunes, curanderos, machis y los guardianes (porteros de la cueva). El jefe supremo en Quicaví era llamado \"el Supremo\" o \"el Buta\". La justicia funcionaba por petición: quien necesitaba una venganza, curación o hallar a un ladrón acudía al presidente de su distrito, que elevaba el caso a la Mayoría; para identificar culpables usaban el challanco.\nRELACIONES:: recta-provincia; siete-republicas; challanco; cueva-quicavi\nFUENTE:: Romo Sánchez, Diccionario de la Brujería\nFUENTE:: crónicas del Proceso de Ancud\nENLACE:: https://es.wikipedia.org/wiki/Recta_Provincia\n@FIN", "prosa": {}}, {"raw": "@ENTIDAD\nID:: siete-republicas\nNOMBRE:: Las siete repúblicas\nALIAS:: Los distritos de la Recta Provincia\nSECCION:: 09-recta-provincia\nCATEGORIA:: relato\nREINO:: lugar\nORIGEN:: mestizo\nALCANCE:: chilota\nCONDICION:: ambiguo\nJERARQUIA:: División territorial de la cofradía\nGANCHO:: Para operar en secreto, dividieron el archipiélago en siete distritos con nombres en clave de ciudades lejanas: Lima, España, Salamanca...\nRESUMEN:: La Recta Provincia dividió Chiloé en siete distritos o \"repúblicas\", cada uno con un nombre en clave de una ciudad española o colonial.\nDESCRIPCION:: Para operar en secreto, la Recta Provincia dividió el archipiélago en siete Distritos o Repúblicas, cada uno con un nombre en clave tomado de lugares de España y sus colonias, para esconder los lugares reales de Chiloé. Cada distrito tenía su presidente y respondía al Rey. Las equivalencias eran: Buenos Aires = Achao; España = Queilén; Lima = Quicaví (la sede del Rey); Perú = Caucahué; Salamanca = Rauco; Santiago = Tenaún; Villarrica = Dalcahue.\nRELACIONES:: recta-provincia; la-mayoria; cueva-quicavi; achao; tenaun\nFUENTE:: Wikipedia (Recta Provincia)\nFUENTE:: Fritz Roa, La Recta Provincia\nENLACE:: https://es.wikipedia.org/wiki/Recta_Provincia\n@FIN", "prosa": {}}, {"raw": "@ENTIDAD\nID:: iniciacion\nNOMBRE:: La iniciación del brujo\nALIAS:: El camino oscuro\nSECCION:: 09-recta-provincia\nCATEGORIA:: relato\nREINO:: lugar\nORIGEN:: mestizo\nALCANCE:: chilota\nCONDICION:: malefico\nJERARQUIA:: —\nADVERTENCIA:: Relato tradicional con actos atroces. Se conserva como testimonio de lo que un pueblo temió, no como instrucción.\nGANCHO:: Para entrar en la Recta Provincia no bastaba con querer: había que recorrer un camino de horror, de cuatro pruebas.\nRESUMEN:: El rito de ingreso a la cofradía: borrar el bautismo, llevar una lagartija, matar al ser más amado y confeccionar el macuñ, seguido de un juramento al Diablo.\nDESCRIPCION:: Las fuentes (juicio de 1880, Cavada, Fritz Roa) coinciden en cuatro pruebas. PRIMERA: borrar el bautismo cristiano bajo una caída de agua (un \"traiguen\"), durante varias noches o hasta cuarenta días; una variante lo hace lavando la cabeza con sangre de un recién nacido no bautizado. SEGUNDA: llevar una lagartija sobre el cuerpo varios días, atada a la frente con un pañuelo rojo, para recibir su sabiduría. TERCERA: asesinar al ser más amado (un hijo o pariente querido), un día martes por la noche. CUARTA: confeccionar el macuñ con piel humana. Luego, en la Cueva de Quicaví ante la Mayoría, el aspirante daba tres vueltas a las islas desnudo, gritando una invocación al Diablo; aparecido este, el jefe le entregaba el macuñ y tomaba el juramento de adhesión al Demonio y secreto absoluto (revelar que se es brujo trae la muerte antes de un año).\nRELACIONES:: brujo-chilote; macun; cueva-quicavi; la-mayoria\nFUENTE:: Documentos del Proceso de Ancud (1880)\nFUENTE:: Fritz Roa, La iniciación y los poderes del brujo chilote\nENLACE:: https://es.wikipedia.org/wiki/Brujos_de_Chilo%C3%A9\n@FIN", "prosa": {"testimonio": ["» Le hicieron hacer la señal de la cruz i Quinchepane le interrogó: «¿Jura usted por indíjena?» El declarante contestó que «sí juraba.» En seguida le hicieron hacer la promesa de no decir nada de lo que viera, de no divulgar los secretos, de prestar consejo cuando lo exija i de cumplir estrictamente las ordenes que se le den, amenazándolo con perder la vida [¿en caso de faltar a alguna?] de estas promesas. Quedó así agregado a la dicha institucion, la cual se conoce entre ellos con el nombre de la «Recta Provincia,» i desde luego se le dió el titulo de Consejero.\n— Mateo Coñuecar, declaración ante el juez, Ancud, 26 de marzo de 1880", "FUENTE:: Los brujos de Chiloé. Célebre proceso del Juzgado de Ancud (Ponce Hermanos, Santiago, 1908; Memoria Chilena MC0033459). Transcripción íntegra y aparato crítico: fuentes/proceso-ancud-1880.md."], "lecturas": ["Hasta el número de pruebas es variante. El corpus del Grimorio (siguiendo el Libro Octavo) registra cuatro: borrar el bautismo, la lagartija, el crimen y el macuñ. Ampuero, recogiendo el libro Juicio a los brujos de Chiloé, registra tres — y en otro orden:", "» el sujeto debía realizar tres pruebas. La primera era confeccionar un macuñ; segundo, «rasparse» el bautismo cristiano bajo una cascada —traiguén— durante cuarenta días, desligándose de todo elemento que lo vincule con su pasado; y tercero, el individuo debía asesinar a un familiar o ser querido para demostrar que no poseía un vínculo sentimental hacia la persona.\n— Ampuero (2016), p. 76", "La lagartija en la frente aparece en unas fuentes y falta en otras. Las variantes se muestran; ninguna se zanja.", "FUENTE:: Ampuero Díaz, E. L. (2016). Mapocho, (80), 61-91 (aquí p. 76). Verificado contra el PDF en fuentes/_raw/lecturas/."]}}, {"raw": "@ENTIDAD\nID:: poderes-del-brujo\nNOMBRE:: Los poderes del brujo\nALIAS:: —\nSECCION:: 09-recta-provincia\nCATEGORIA:: relato\nREINO:: lugar\nORIGEN:: mestizo\nALCANCE:: chilota\nCONDICION:: malefico\nJERARQUIA:: —\nGANCHO:: Volar, transformarse en animal, hablar con los muertos, lanzar males a distancia, dominar las aguas.\nRESUMEN:: El repertorio de poderes del brujo chilote, según la enumeración de Fritz Roa, más sus técnicas de maleficio.\nDESCRIPCION:: Con el macuñ y su arte, el brujo podía: (a) volar mediante el macuñ; (b) transformarse en animales (perro, caballo, lagartija); (c) adormecer a hombres y animales; (d) hablar con los muertos y hacerlos hablar; (e) lanzar males a distancia —el \"mal tirado\", el \"llancazo\", el \"coihuazo\", maleficios disparados como balas invisibles; (f) dominar las aguas (detenerlas, subirlas, bajarlas); (g) preparar venenos y filtros de amor con hierbas (el \"llapuy\"); (h) usar el challanco. Para saber si una víctima era vulnerable, le hacía \"sajaduras\" (cortaduras imperceptibles) y observaba la reacción.\nRELACIONES:: brujo-chilote; macun; challanco; ruende\nFUENTE:: Fritz Roa, La iniciación y los poderes del brujo chilote\nFUENTE:: Romo Sánchez, Diccionario de la Brujería\nENLACE:: http://brujeriachilena.blogspot.com/2016/03/la-iniciacion-y-los-poderes-del-brujo.html\n@FIN", "prosa": {}}, {"raw": "@ENTIDAD\nID:: machi\nNOMBRE:: La Machi\nALIAS:: —\nSECCION:: 09-recta-provincia\nCATEGORIA:: brujo-humano\nREINO:: lugar\nORIGEN:: prehispanico\nALCANCE:: chilota-raiz-mapuche\nCONDICION:: benefico\nJERARQUIA:: —\nGANCHO:: La sanadora, la que cura con hierbas y conoce el mundo de los espíritus.\nRESUMEN:: Sanadora de raíz mapuche, con funciones parcialmente distintas en Chiloé. Cura, no daña; contrapunto del brujo y el calcu.\nDESCRIPCION:: Persona que desempeña un rol importante en la cultura y religión mapuche, pero que en Chiloé tiene características y funciones parcialmente diferentes. Es la sanadora: cura con hierbas, conoce el mundo espiritual y obra para el bien (a diferencia del calcu y del brujo dañino). Puede buscar la Curamilla o lacear al Camahueto sin codicia, por sus dones.\nRELACIONES:: brujo-chilote; calcu; camahueto; curamilla\nFUENTE:: tradición mapuche-chilota\nENLACE:: https://es.wikipedia.org/wiki/Mitolog%C3%ADa_chilota\n@FIN", "prosa": {}}, {"raw": "@ENTIDAD\nID:: calcu\nNOMBRE:: El Calcu\nALIAS:: Kalku\nSECCION:: 09-recta-provincia\nCATEGORIA:: brujo-humano\nREINO:: lugar\nORIGEN:: prehispanico\nALCANCE:: chilota-raiz-mapuche\nCONDICION:: malefico\nJERARQUIA:: —\nGANCHO:: El hechicero que hace daño, raíz indígena del brujo chilote.\nRESUMEN:: Hechicero mapuche que obra el mal, una de las raíces del brujo de Chiloé. Domina maleficios y criaturas oscuras.\nDESCRIPCION:: Hechicero de la tradición mapuche que se dedica a hacer daño (a diferencia de la machi, que sana). Es una de las raíces directas del brujo chilote. Domina maleficios, busca objetos de poder como la Curamilla por codicia, y se vincula a la creación de seres oscuros como el Invunche (\"producto de la unión de un calcu con una bruja\", según una versión).\nRELACIONES:: brujo-chilote; machi; invunche\nFUENTE:: tradición mapuche-chilota\nENLACE:: https://es.wikipedia.org/wiki/Brujos_de_Chilo%C3%A9\n@FIN", "prosa": {}}, {"raw": "@ENTIDAD\nID:: libro-de-moraleda\nNOMBRE:: El Libro de Moraleda\nALIAS:: El Libro de Arte\nSECCION:: 09-recta-provincia\nCATEGORIA:: relato\nREINO:: lugar\nORIGEN:: colonial\nALCANCE:: chilota\nCONDICION:: ambiguo\nJERARQUIA:: —\nGANCHO:: El grimorio perdido del que, según la leyenda, nació toda la brujería de Chiloé.\nRESUMEN:: Libro de hechicería europea que el explorador español Moraleda habría regalado a una bruja chilota tras un duelo de magia, origen legendario de la Recta Provincia.\nDESCRIPCION:: Según el origen legendario de la cofradía, hacia 1786, en Tenaún, la bruja chilota Chilpilla se enfrentó al explorador español José de Moraleda (personaje real que cartografió estas costas). Para demostrar su poder, la bruja dejó el barco de Moraleda \"en seco\", varado; él, rendido, le regaló un libro de hechicería europea (el \"Libro de Arte\"), cuyo paradero se desconoce. De ese encuentro entre la magia indígena y el saber europeo habría nacido la brujería organizada de Chiloé. Es leyenda, pero recoge una verdad: que la brujería chilota es ese cruce de dos mundos.\nRELACIONES:: recta-provincia; tenaun; juicio-1880\nFUENTE:: Esploraciones jeográficas de José de Moraleda (Anuario Hidrográfico, 1887)\nFUENTE:: Fritz Roa, La Recta Provincia\nENLACE:: https://es.wikipedia.org/wiki/Recta_Provincia\n@FIN", "prosa": {}}],
    publicadas: ["caleuche", "pincoya", "trauco", "invunche", "cueva-quicavi", "recta-provincia", "brujo-chilote", "macun", "challanco", "voladora", "juicio-1880", "camahueto"]

      <span class="fog__layer fog__layer--1" data-parallax="-0.06"></span>
      <span class="fog__layer fog__layer--2" data-parallax="-0.11"></span>
      <span class="fog__layer fog__layer--3" data-parallax="-0.17"></span>
    </div>

    <div class="hero__portal" aria-hidden="true"><span></span></div>

    <div class="hero__copy">
      <p class="hero__eyebrow" id="hero-cat">Bestiario</p>
      <h1 class="hero__name" id="hero-name">·</h1>
      <p class="hero__alias" id="hero-alias"></p>
    </div>

    <a class="hero__cue" href="#descenso" aria-label="Descender a la ficha">
      <span>desciende</span>
      <span class="hero__chev" aria-hidden="true"><img class="hero__plomada" src="assets/img/indicador-plomada.png" alt="" width="19" height="48" decoding="async"></span>
    </a>
  </header>

  <!-- ════════ DESCENSO · cuerpo de la ficha ════════ -->
  <div class="scroll" id="descenso">

    <!-- Fondo del descenso: el mundo de la criatura una sola vez arriba, fundido al negro -->
    <div class="descenso-bg" aria-hidden="true" data-parallax="0.16" data-rel="descenso"></div>

    <!-- Gancho: epígrafe atmosférico -->
    <section class="movement movement--gancho reveal" id="sec-gancho">
      <p class="gancho" id="gancho"></p>
    </section>

    <!-- Placa de datos de bestiario -->
    <section class="movement reveal" id="sec-datos" aria-labelledby="h-datos">
      <div class="rule"><h2 id="h-datos">Datos de bestiario</h2></div>
      <div class="frame frame--plaque">
        <div class="frame__panel">
          <dl class="datos" id="datos"></dl>
        </div>
      </div>
    </section>

    <!-- Resumen + descripción -->
    <section class="movement reveal lectura" id="sec-relato" aria-labelledby="h-relato">
      <div class="rule"><h2 id="h-relato">El relato</h2></div>
      <blockquote class="resumen" id="resumen"></blockquote>
      <div class="descripcion" id="descripcion"></div>
    </section>

    <!-- Variantes: cajones de archivo -->
    <section class="movement reveal" id="sec-variantes" aria-labelledby="h-var">
      <div class="rule"><h2 id="h-var">Variantes del relato</h2></div>
      <div class="cajones" id="variantes"></div>
    </section>

    <!-- Vitrina del capítulo: piezas del corpus sin parada propia, embebidas
         VERBATIM (solo si la página trae window.FICHA.galeria) -->
    <section class="movement reveal" id="sec-vitrina-cap" aria-labelledby="h-vitrina-cap" hidden>
      <div class="rule"><h2 id="h-vitrina-cap">Vitrina del capítulo</h2></div>
      <div class="galeria" id="galeria"></div>
    </section>

    <!-- Defensa: cómo enfrentarlo (solo si la entidad lo trae) -->
    <section class="movement reveal" id="sec-defensa" aria-labelledby="h-defensa" hidden>
      <div class="rule"><h2 id="h-defensa">Defensa</h2></div>
      <div class="frame frame--plaque">
        <div class="frame__panel">
          <p class="defensa" id="defensa"></p>
        </div>
      </div>
    </section>

    <!-- Interpretación: nota del archivero -->
    <section class="movement reveal" id="sec-interp">
      <aside class="nota">
        <span class="nota__pin" aria-hidden="true"></span>
        <span class="nota__label">Nota del archivero</span>
        <p class="nota__text" id="interpretacion"></p>
      </aside>
    </section>

    <!-- De dónde nació el mito: prosa del grimorio (oculta si la criatura no la trae) -->
    <section class="movement reveal lectura" id="sec-origen" aria-labelledby="h-origen" hidden>
      <div class="rule"><h2 id="h-origen">De dónde nació el mito</h2></div>
      <div class="prosa" id="origen-mito"></div>
    </section>

    <!-- Lecturas: qué dice la academia (solo si la prosa trae @LECTURAS).
         Placa sobria diferenciada; contenido verificado contra fuentes/_raw/lecturas/. -->
    <section class="movement reveal" id="sec-lecturas" aria-labelledby="h-lecturas" hidden>
      <div class="rule"><h2 id="h-lecturas">Lecturas</h2></div>
      <div class="lecturas" id="lecturas">
        <p class="lecturas__intro">Qué dice la investigación académica sobre esta pieza.</p>
      </div>
    </section>

    <!-- Desarrollo documental (solo si la entidad lo trae) -->
    <section class="movement reveal" id="sec-desarrollo" hidden>
      <p class="desarrollo" id="desarrollo"></p>
    </section>

    <!-- Vitrina: otras piezas del archipiélago -->
    <section class="movement reveal" id="sec-vitrina" aria-labelledby="h-vitrina">
      <div class="rule"><h2 id="h-vitrina">Otras piezas del archipiélago</h2></div>
      <div class="vitrina" id="vitrina"></div>
    </section>

    <!-- Fuentes y enlaces -->
    <footer class="movement reveal pie" id="pie"></footer>
  </div>

  <!-- ════════ CIERRE · el corazón del mundo (fin del viaje) ════════ -->
  <section class="cierre" id="cierre" aria-label="Cierre">
    <div class="cierre__bg" aria-hidden="true"></div>
    <div class="cierre__edges" aria-hidden="true"></div>
    <div class="cierre__glow" aria-hidden="true"></div>
    <div class="fog cierre__fog" aria-hidden="true">
      <span class="fog__layer fog__layer--2"></span>
      <span class="fog__layer fog__layer--3"></span>
    </div>
    <p class="cierre__phrase reveal"></p>
    <p class="sello">El Grimorio del Archipiélago</p>
  </section>
</main>

<script src="assets/js/config.js" defer></script>
<script src="assets/js/ficha.js" defer></script>
<script src="assets/js/data/capitulos.js" defer></script>
<script src="assets/js/data/indice.js" defer></script>
<script src="assets/js/camino.js" defer></script>
<script src="assets/js/sonido.js" defer></script>
</body>
</html>
