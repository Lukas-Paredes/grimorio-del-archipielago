<!-- Preferencias ANTES del primer frame: pausa de movimiento (grimorio:motion /
     reduced-motion) y velo de bruma si venimos de otra página del camino.
     Idéntico en todas las páginas del sistema nuevo. -->
<script>
(function () {
  try {
    var m = localStorage.getItem("grimorio:motion");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (m === "off" || (m === null && reduce)) {
      document.documentElement.classList.add("motion-off");
    }
    if (sessionStorage.getItem("grimorio:bruma") === "1") {
      document.documentElement.classList.add("bruma-in");
    }
  } catch (e) {}
})();
</script>

<!-- Imágenes de ESTA criatura. Las url() de variables CSS las resuelve el
     navegador relativo a ficha.css (assets/css/), por eso van con "../img/...".
     El <img> del hero, en cambio, es relativo a la página: "assets/img/...". -->
<style>
  body {
    --img-fondo: none;                                  /* sin imagen de mar; solo penumbra */
    --img-descenso: none;                               /* sin naufragio; degradado abisal neutro */
    --img-cierre: none;                                 /* sin lecho marino; degradado abisal neutro */
  }
</style>

<!-- Config de la página. GENERADA por herramientas/generar_fichas.py desde
     El_Grimorio_Datos_Estructurados.txt (raw VERBATIM) + contenido/prosa/<id>.txt.
     No editar a mano: regenerar. ficha.js la lee (window.FICHA). -->
<script>
  window.FICHA = {
    raw: `@ENTIDAD
ID:: challanco
NOMBRE:: El Challanco
ALIAS:: La mapa; el revisorio
SECCION:: 09-recta-provincia
CATEGORIA:: objeto-magico
REINO:: lugar
ORIGEN:: mestizo
ALCANCE:: chilota
CONDICION:: malefico
JERARQUIA:: —
GANCHO:: El objeto con que el brujo ve lo que pasa lejos, conoce el futuro y descubre quién lanzó un maleficio.
RESUMEN:: Objeto adivinatorio del brujo, que permite ver a distancia, conocer el futuro e identificar al autor de un maleficio.
DESCRIPCION:: Objeto adivinatorio del brujo. Permite saber lo que ocurre en lugares lejanos, conocer el futuro, y revelar a la víctima de un maleficio quién fue el brujo que se lo lanzó. No hay acuerdo sobre qué es: para unos una batea con agua, para otros un espejo, para otros una bola de cristal. Se le llamaba también "la mapa" o "el revisorio". La Mayoría lo usaba para identificar culpables en sus juicios.
RELACIONES:: poderes-del-brujo; la-mayoria; brujo-chilote
FUENTE:: Romo Sánchez, Diccionario de la Brujería
FUENTE:: Mateo Coñuecar (declaración, Proceso de Ancud 1880)
ENLACE:: https://www.memoriachilena.gob.cl/archivos2/pdfs/MC0033461.pdf
@FIN`,
    prosa: {
      "descripcion": [
        "Objeto adivinatorio del brujo. Permite saber lo que ocurre en lugares lejanos y conocer el futuro; y revela a la víctima de un maleficio quién fue el brujo que se lo «lanzó». No hay acuerdo sobre qué es: para unos, una batea con agua; para otros, un espejo; para otros, una bola de cristal. Se le llamaba también «la mapa» o «el revisorio»."
      ],
      "lecturas": [
        "Los archivos penales del proceso de 1880 conservan una escena del objeto en acción — y suman una conformación más a las que registra el corpus (batea con agua, espejo, bola de cristal). Catepillan la rescata de la declaración de Pedro Antonio Güichapane (7 de abril de 1880): el machi Benito Panichine puso unas piedras en un vaso con agua,",
        "» acto seguido de lo cual «comenzó a romancear en veliche» fijándose en el vaso, con la esperanza de averiguar quién tenía enfermo al paisano Colipichun.\n— Catepillan (2019), p. 99, nota 55",
        "Catepillan anota además que esa es la única mención del idioma mapuzugun en todo el proceso. La variante se muestra, no se zanja: vaso, batea, espejo o cristal — las fuentes no acuerdan qué era el challanco, solo qué hacía.",
        "FUENTE:: Catepillan Tessi, T. (2019). La República de la Raza. Trashumante, (13), 84-107 (aquí p. 99, n. 55). Verificado contra el PDF en fuentes/_raw/lecturas/."
      ]
    },
    cierre: "La Mayoría lo usaba para identificar culpables en sus juicios.",
    galeria: [],
    publicadas: ["caleuche", "pincoya", "trauco", "invunche", "cueva-quicavi", "recta-provincia", "brujo-chilote", "macun", "challanco", "voladora", "juicio-1880", "camahueto"]
  };
</script>
