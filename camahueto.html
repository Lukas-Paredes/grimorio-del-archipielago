<!-- Preferencias ANTES del primer frame: pausa de movimiento (grimorio:motion /
     reduced-motion) y velo de bruma si venimos de otra página del camino.
     Idéntico en todas las páginas del sistema nuevo. -->
<script>
(function () {
  try {
    var m = localStorage.getItem("grimorio:motion");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (m === "off" || (m === null && reduce)) {
      document.documentElement.classList.add("motion-off");
    }
    if (sessionStorage.getItem("grimorio:bruma") === "1") {
      document.documentElement.classList.add("bruma-in");
    }
  } catch (e) {}
})();
</script>

<!-- Imágenes de ESTA criatura. Las url() de variables CSS las resuelve el
     navegador relativo a ficha.css (assets/css/), por eso van con "../img/...".
     El <img> del hero, en cambio, es relativo a la página: "assets/img/...". -->
<style>
  body {
    --img-fondo: none;                                  /* sin imagen de mar; solo penumbra */
    --img-descenso: image-set(url("../img/camahueto-descenso.webp") type("image/webp"), url("../img/camahueto-descenso.png") type("image/png"));
    --img-cierre: image-set(url("../img/camahueto-cierre.webp") type("image/webp"), url("../img/camahueto-cierre.png") type("image/png"));
  }
</style>

<!-- Config de la página. GENERADA por herramientas/generar_fichas.py desde
     El_Grimorio_Datos_Estructurados.txt (raw VERBATIM) + contenido/prosa/<id>.txt.
     No editar a mano: regenerar. ficha.js la lee (window.FICHA). -->
<script>
  window.FICHA = {
    raw: `@ENTIDAD
ID:: camahueto
NOMBRE:: El Camahueto
ALIAS:: —
SECCION:: 05-bestias
CATEGORIA:: bestia-zoomorfa
REINO:: cerro-rio
ORIGEN:: prehispanico
ALCANCE:: chilota
CONDICION:: ambiguo
JERARQUIA:: —
GANCHO:: Nace en lo alto de los cerros y duerme décadas. Un día de tormenta despierta y baja al mar arrasando todo; los surcos de su cuerno se vuelven ríos.
RESUMEN:: Bestia con forma de ternero y cuerno único dorado, de fuerza descomunal. Su cuerno tiene poderes curativos. Explica las riadas.
DESCRIPCION:: Aspecto de ternero de un año, color verde o gris brillante, con un solo cuerno dorado en la frente (un unicornio del sur). Fuerza descomunal. Nace en los cerros vecinos al mar; tras crecer décadas bajo tierra, arranca al mar en día de tormenta arrasando árboles, rocas y barro. Los surcos que abre su cuerno dan origen a los riachuelos.
VARIANTE:: El cuerno que sana | Su cacho concentra sus poderes; raspaduras del cuerno se usaban como remedio de fuerza y para devolver el vigor sexual. Los machis lo buscaban.
VARIANTE:: Cómo matarlo | Se contrata a un brujo llamado el LACERO, que teje un lazo con algas (sargazo o luga) y le arranca el cuerno, donde reside su poder. Una machi puede hacerlo con cuerda de voqui.
VARIANTE:: El encuentro | Baja al mar a juntarse y aparearse con la Vaca Marina chilota.
INTERPRETACION:: Su cuerno de abundancia recuerda la cornucopia de Amaltea. Es el mito que explica las riadas que bajan de los cerros en años de tormentas. Probablemente prehispánico.
RELACIONES:: vaca-marina; calcu
FUENTE:: Núñez (2022), Servicio Nacional del Patrimonio Cultural
FUENTE:: García Barría, Tesoro Mitológico
ENLACE:: https://www.guioteca.com/cultura-chilena/mitologia-de-chiloe-guia-para-conocer-y-entender-a-sus-extranas-y-temibles-criaturas/
@FIN`,
    prosa: {
      "descripcion": [
        "El Camahueto tiene el aspecto de un ternero de cerca de un año, de color verde o gris muy brillante, con un solo cuerno dorado en mitad de la frente —como un unicornio del sur. Su fuerza es descomunal. Nace en lo alto de los cerros vecinos al mar y, tras crecer por décadas en sus entrañas, arranca un día hacia el mar —generalmente en días de tormenta— arrasando todo a su paso: árboles, rocas, barro. Los surcos que va abriendo en la tierra con su cuerno dan origen a los riachuelos. Lo que los geólogos llaman erosión, el chilote lo llama Camahueto.",
        "Las fuentes cuentan varios modos en que nace: de un trozo del cuerno de otro camahueto enterrado en los cerros; del polvo de ese cuerno lanzado a un pozo; o como cría de la vaca marina chilota, que va a enterrarse en una madriguera bajo la tierra. Pasa entre veinte y treinta años bajo tierra antes de emerger."
      ],
      "interpretacion": "Su cuerno de abundancia recuerda a la cornucopia de la cabra Amaltea, la ninfa que amamantó a Zeus: ambos, símbolos de fecundidad y de fuerza. Y, como con Tenten y Caicai, hay aquí memoria de la naturaleza real: el Camahueto es el mito con que el pueblo explica las riadas que, en años de muchas tormentas, bajan de los cerros al mar arrasando todo. Se le cuenta entre las criaturas probablemente prehispánicas."
    },
    cierre: "Y donde el surco encuentra el mar, el agua vuelve a estar en calma.",
    publicadas: ["caleuche", "pincoya", "trauco", "invunche", "camahueto"]
  };
</script>

<body data-entity="camahueto">

    <div class="descenso-bg" aria-hidden="true" data-parallax="0.16" data-rel="descenso"></div>

    <!-- Gancho: epígrafe atmosférico -->
    <section class="movement movement--gancho reveal" id="sec-gancho">
      <p class="gancho" id="gancho"></p>
    </section>

    <!-- Placa de datos de bestiario -->
    <section class="movement reveal" id="sec-datos" aria-labelledby="h-datos">

      <div class="frame frame--plaque">
        <div class="frame__panel">
          <dl class="datos" id="datos"></dl>
        </div>
      </div>
    </section>

    <!-- Resumen + descripción -->
    <section class="movement reveal lectura" id="sec-relato" aria-labelledby="h-relato">
      <div class="rule"><h2 id="h-relato">El relato</h2></div>
      <blockquote class="resumen" id="resumen"></blockquote>
      <div class="descripcion" id="descripcion"></div>
    </section>

    <!-- Variantes: cajones de archivo -->
    <section class="movement reveal" id="sec-variantes" aria-labelledby="h-var">
      <div class="rule"><h2 id="h-var">Variantes del relato</h2></div>

    </section>

      <div class="frame frame--plaque">
        <div class="frame__panel">
          <p class="defensa" id="defensa"></p>
        </div>
      </div>
    </section>

    <!-- Interpretación: nota del archivero -->
    <section class="movement reveal" id="sec-interp">
      <aside class="nota">
        <span class="nota__pin" aria-hidden="true"></span>
        <span class="nota__label">Nota del archivero</span>
        <p class="nota__text" id="interpretacion"></p>
      </aside>
    </section>

    <!-- De dónde nació el mito: prosa del grimorio (oculta si la criatura no la trae) -->
    <section class="movement reveal lectura" id="sec-origen" aria-labelledby="h-origen" hidden>
      <div class="rule"><h2 id="h-origen">De dónde nació el mito</h2></div>
      <div class="prosa" id="origen-mito"></div>
    </section>

    <!-- Desarrollo documental (solo si la entidad lo trae) -->
    <section class="movement reveal" id="sec-desarrollo" hidden>
      <p class="desarrollo" id="desarrollo"></p>
    </section>

    <!-- Vitrina: otras piezas del archipiélago -->

      <div class="vitrina" id="vitrina"></div>
    </section>

  </div>

  </section>
