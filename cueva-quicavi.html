<!-- Preferencias ANTES del primer frame: pausa de movimiento (grimorio:motion /
     reduced-motion) y velo de bruma si venimos de otra página del camino.
     Idéntico en todas las páginas del sistema nuevo. -->
<script>
(function () {
  try {
    var m = localStorage.getItem("grimorio:motion");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (m === "off" || (m === null && reduce)) {
      document.documentElement.classList.add("motion-off");
    }
    if (sessionStorage.getItem("grimorio:bruma") === "1") {
      document.documentElement.classList.add("bruma-in");
    }
  } catch (e) {}
})();
</script>

<!-- Imágenes de ESTA criatura. Las url() de variables CSS las resuelve el
     navegador relativo a ficha.css (assets/css/), por eso van con "../img/...".

<!-- Config de la página. GENERADA por herramientas/generar_fichas.py desde
     El_Grimorio_Datos_Estructurados.txt (raw VERBATIM) + contenido/prosa/<id>.txt.
     No editar a mano: regenerar. ficha.js la lee (window.FICHA). -->
<script>
  window.FICHA = {
    raw: `@ENTIDAD
ID:: cueva-quicavi
NOMBRE:: La Cueva de Quicaví
ALIAS:: La Casa Grande; La Revisoria
SECCION:: 09-recta-provincia
CATEGORIA:: lugar
REINO:: lugar
ORIGEN:: mestizo
ALCANCE:: chilota
CONDICION:: malefico
JERARQUIA:: Sede de la Mayoría; capital de la brujería
GANCHO:: La capital de la Recta Provincia. Una cueva oculta en la costa de Quemchi, con letras grabadas que nadie ha podido leer, y el Invunche en la boca.
RESUMEN:: La cueva-sede de la Recta Provincia, en Quicaví (Quemchi), donde se reunía la Mayoría y residía el Rey, guardada por el Invunche.
DESCRIPCION:: También llamada la Casa Grande o la Revisoria, era el corazón de la Recta Provincia: morada oficial de los brujos, donde se reunía la Mayoría, residía el Rey, llegaban volando los brujos con sus macuñ encendidos, se hacían las iniciaciones y se dictaban los castigos. Está en los alrededores de Quicaví, comuna de Quemchi (costa este de la Isla Grande). La cuidaba el Invunche. Su entrada se abría con un ritual (algunos hablan de una "llave de alquimia"). Aún hoy se halla en la zona una cueva con letras grabadas casi borradas por el musgo, de origen desconocido.
VARIANTE:: "Aquelarre" | Cuando en la escuela de Quicaví se consultó a los niños para ponerle nombre, ellos eligieron llamarla "Aquelarre".
RELACIONES:: recta-provincia; la-mayoria; invunche; quicavi; iniciacion
FUENTE:: Wikipedia (Brujos de Chiloé)
FUENTE:: Romo Sánchez, Diccionario de la Brujería
ENLACE:: https://es.wikipedia.org/wiki/Brujos_de_Chilo%C3%A9
@FIN`,
    prosa: {
      "descripcion": [
        "La Cueva de Quicaví —también llamada la Casa Grande, o la Revisoria— era el corazón de la Recta Provincia: la morada oficial de los brujos, donde se reunía la Mayoría y residía el Rey. Está en los alrededores de Quicaví, en la comuna de Quemchi, en la costa este de la Isla Grande. Allí llegaban volando los brujos con sus macuñ encendidos; allí se celebraban las asambleas, se dictaban los castigos, se hacían las iniciaciones. La cuidaba el Invunche, que guardaba su entrada.",
        "Según la tradición, la Cueva tenía su entrada oculta y se abría mediante un ritual —algunos hablan de una «llave de alquimia». Caminando entre la tupida vegetación de la zona, se puede hallar todavía una cueva en cuyas paredes hay letras grabadas, casi borradas por el musgo, de origen que nadie conoce con certeza. Los lugareños la conocen y la respetan; muchos prefieren no interpretarla, y dejarse llevar por la magia del lugar."
      ],
      "interpretacion": "Quicaví sigue siendo conocida como «la cuna de la brujería chilota», y hay recorridos nocturnos que llevan a conocer su historia y a ver una representación del Invunche. El mito se ha vuelto, también, memoria viva y patrimonio.",
      "testimonio": [
        "» En el mismo Quicaví los indíjenas desde un tiempo mui remoto, pero que debe guardar cierta conformidad con la llegada de la Chillpila a Quicaví, construyeron una casa subterránea que todos la denominan con el nombre de la «Cueva de Quicaví».\n— Mateo Coñuecar, declaración ante el juez, Ancud, 26 de marzo de 1880",
        "» Esa habitación adentro está enmaderada, tiene una mesa, cuatro sillas principales i tres bancos de madera.\n— Mateo Coñuecar, 26 de marzo de 1880",
        "» Merimañ lo acompañó i al llegar a la cueva, éste comenzó a dar unos saltos que acostumbran los brujos i en seguida abrió la puerta. Esta se hallaba cubierta con una capa de tierra i césped con pasto para ocultarla; despues se encontraba una chapa que tenia llave de alquimia.\n— Mateo Coñuecar, 26 de marzo de 1880",
        "» A los tres dias de haberse recibido del nuevo puesto que tiene, ordenó a Miguel Raicagüin de Tenaun i al finado José Calbuyagüe que llevaran la llave i fueran a abrir la cueva. Volvieron diciéndole que no se podia abrir i que la puerta estaba atrancada por dentro.\n— Mateo Coñuecar, 26 de marzo de 1880",
        "» Nunca ha ido a la cueva, pero Pascual Coñuecar le dijo que se retirara de la casa en que vivia, porque en el punto en que estaba era un lugar malo i ella siempre sentia mucha bulla a los alrededores. Esto la hizo creer que por ahí estaba dicha cueva, i para quedar tranquila se mudó a otra parte, hácia la montaña.\n— Aurora Quinchem, declaración ante el juez, Ancud, 27 de marzo de 1880",
        "FUENTE:: Los brujos de Chiloé. Célebre proceso del Juzgado de Ancud (Ponce Hermanos, Santiago, 1908; Memoria Chilena MC0033459). Transcripción íntegra y aparato crítico: fuentes/proceso-ancud-1880.md."
      ]
    },
    cierre: "Y en la boca, vigilaba el Invunche.",
    galeria: [],
    publicadas: ["caleuche", "pincoya", "trauco", "invunche", "cueva-quicavi", "recta-provincia", "brujo-chilote", "macun", "challanco", "voladora", "camahueto"]
  };
